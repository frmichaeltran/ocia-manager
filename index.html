<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCIA Program — St. Catherine of Siena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', sans-serif; background: #F7F4FC; color: #3D2C6B; }
    h1,h2,h3,h4 { font-family: 'Playfair Display', serif; }
    .app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 220px; background: #3D2C6B; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-logo .parish { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #9B7FD4; margin-bottom: 4px; }
    .sidebar-logo h2 { font-family: 'Playfair Display', serif; color: #FFFFFF; font-size: 16px; line-height: 1.3; }
    .sidebar-logo .badge { display: inline-block; margin-top: 6px; background: #DDD0F5; color: #3D2C6B; font-size: 9px; font-weight: 600; letter-spacing: 1px; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; }
    .sidebar-nav { flex: 1; padding: 16px 0; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 400; transition: all 0.15s; border-left: 3px solid transparent; }
    .nav-item:hover { color: #FFFFFF; background: rgba(255,255,255,0.05); }
    .nav-item.active { color: #FFFFFF; background: rgba(155,127,212,0.18); border-left-color: #9B7FD4; font-weight: 500; }
    .nav-item .nav-icon { font-size: 16px; width: 18px; text-align: center; }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.08); }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: #FFFFFF; border-bottom: 1px solid #DDD5EE; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 20px; color: #3D2C6B; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: #3D2C6B; color: #DDD0F5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; font-family: 'Playfair Display', serif; cursor: pointer; }
    .content { flex: 1; overflow-y: auto; padding: 28px; }
    .card { background: #FFFFFF; border: 1px solid #DDD5EE; border-radius: 12px; padding: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: #FFFFFF; border: 1px solid #DDD5EE; border-radius: 12px; padding: 18px 20px; }
    .stat-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #7B6FA0; margin-bottom: 6px; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 28px; color: #3D2C6B; }
    .stat-sub { font-size: 12px; color: #7B6FA0; margin-top: 2px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: 'Source Sans 3', sans-serif; }
    .btn-primary { background: #3D2C6B; color: #FFFFFF; }
    .btn-primary:hover { background: #2e1f54; }
    .btn-gold { background: #9B7FD4; color: #FFFFFF; }
    .btn-gold:hover { background: #8166c0; }
    .btn-outline { background: transparent; color: #3D2C6B; border: 1px solid #DDD5EE; }
    .btn-outline:hover { background: #F7F4FC; }
    .btn-danger { background: transparent; color: #B84040; border: 1px solid #e8c0c0; }
    .btn-danger:hover { background: #fdf0f0; }
    .btn-sm { padding: 5px 11px; font-size: 12px; }
    .btn-block { width: 100%; justify-content: center; padding: 11px 16px; font-size: 15px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 10px 14px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #7B6FA0; border-bottom: 1px solid #DDD5EE; font-weight: 500; background: #F7F4FC; }
    td { padding: 12px 14px; border-bottom: 1px solid #DDD5EE; color: #3D2C6B; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F7F4FC; }
    .badge-stage { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .stage-pre { background: #FEF3C7; color: #92400E; }
    .stage-cat { background: #DBEAFE; color: #1E40AF; }
    .stage-pe { background: #EDE9FE; color: #5B21B6; }
    .stage-mys { background: #D1FAE5; color: #065F46; }
    .progress-bar { height: 6px; background: #DDD5EE; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: #9B7FD4; border-radius: 3px; transition: width 0.3s; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal { background: #FFFFFF; border-radius: 16px; width: 520px; max-width: 100%; max-height: 85vh; overflow-y: auto; }
    .modal-header { padding: 22px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; }
    .modal-header h3 { font-family: 'Playfair Display', serif; font-size: 20px; color: #3D2C6B; }
    .modal-body { padding: 20px 24px 24px; }
    .modal-footer { padding: 0 24px 22px; display: flex; justify-content: flex-end; gap: 8px; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #7B6FA0; line-height: 1; padding: 2px 6px; border-radius: 4px; }
    .close-btn:hover { background: #F7F4FC; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: #7B6FA0; margin-bottom: 5px; }
    .form-input { width: 100%; padding: 9px 12px; border: 1px solid #DDD5EE; border-radius: 8px; font-size: 14px; font-family: 'Source Sans 3', sans-serif; color: #3D2C6B; background: #F7F4FC; outline: none; transition: border 0.15s; }
    .form-input:focus { border-color: #9B7FD4; background: #FFFFFF; }
    select.form-input { cursor: pointer; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .announcement { padding: 14px 16px; background: #FFFFFF; border-radius: 0 8px 8px 0; margin-bottom: 12px; border: 1px solid #DDD5EE; border-left: 3px solid #9B7FD4; }
    .ann-meta { font-size: 11px; color: #7B6FA0; margin-bottom: 4px; }
    .ann-body { font-size: 14px; color: #3D2C6B; line-height: 1.5; }
    .material-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1px solid #DDD5EE; border-radius: 10px; background: #FFFFFF; margin-bottom: 10px; }
    .material-icon { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .material-info { flex: 1; min-width: 0; }
    .material-name { font-size: 14px; font-weight: 500; color: #3D2C6B; }
    .material-meta { font-size: 12px; color: #7B6FA0; margin-top: 2px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-day-header { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #7B6FA0; padding: 8px 0; }
    .cal-day { min-height: 64px; border: 1px solid #DDD5EE; border-radius: 6px; padding: 6px; background: #FFFFFF; }
    .cal-day.other-month { background: #F7F4FC; opacity: 0.5; }
    .cal-day.today { border-color: #9B7FD4; }
    .cal-date { font-size: 12px; font-weight: 500; margin-bottom: 3px; }
    .cal-event { font-size: 10px; background: #3D2C6B; color: #FFFFFF; border-radius: 3px; padding: 1px 5px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .cal-event:hover { background: #9B7FD4; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .section-header h2 { font-size: 22px; }
    .search-input { padding: 8px 12px 8px 36px; border: 1px solid #DDD5EE; border-radius: 8px; font-size: 13px; background: #F7F4FC; outline: none; transition: border 0.15s; width: 220px; font-family: 'Source Sans 3', sans-serif; }
    .search-input:focus { border-color: #9B7FD4; background: #FFFFFF; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #7B6FA0; font-size: 14px; }
    input[type=checkbox] { accent-color: #3D2C6B; width: 15px; height: 15px; cursor: pointer; }
    .empty { text-align: center; padding: 48px 20px; color: #7B6FA0; }
    .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
    .empty p { font-size: 14px; }
    .welcome-banner { background: #3D2C6B; border-radius: 14px; padding: 24px 28px; color: #FFFFFF; margin-bottom: 24px; position: relative; overflow: hidden; }
    .welcome-banner::before { content: '✝'; position: absolute; right: 24px; top: 50%; transform: translateY(-50%); font-size: 80px; opacity: 0.08; }
    .welcome-banner h2 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 4px; }
    .welcome-banner p { font-size: 14px; opacity: 0.7; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    /* Login */
    .login-page { min-height: 100vh; background: #3D2C6B; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: #FFFFFF; border-radius: 20px; padding: 40px; width: 400px; max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo .cross { font-size: 32px; color: #9B7FD4; margin-bottom: 8px; }
    .login-logo .parish { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #7B6FA0; margin-bottom: 4px; }
    .login-logo h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: #3D2C6B; }
    .error-msg { background: #fdf0f0; border: 1px solid #e8c0c0; color: #B84040; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .logout-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: rgba(255,255,255,0.7); font-size: 12px; cursor: pointer; transition: all 0.15s; font-family: 'Source Sans 3', sans-serif; }
    .logout-btn:hover { background: rgba(255,255,255,0.18); color: #FFFFFF; }
    /* Event detail popup */
    .event-popup { position: fixed; background: #FFFFFF; border: 1px solid #DDD5EE; border-radius: 12px; padding: 16px; width: 280px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); z-index: 200; }
    .event-popup h4 { font-size: 16px; margin-bottom: 8px; }
    .event-detail-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #7B6FA0; margin-bottom: 6px; }
    .event-detail-row span:first-child { flex-shrink: 0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #DDD5EE; border-radius: 3px; }
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
      .form-row-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const C = {
      navy:"#3D2C6B", gold:"#9B7FD4", goldLight:"#DDD0F5", cream:"#F7F4FC",
      white:"#FFFFFF", muted:"#7B6FA0", border:"#DDD5EE",
      danger:"#B84040", success:"#2E7D5A", info:"#5B3FBE",
    };

    const STAGES = ["Pre-Catechumenate","Catechumenate","Purification & Enlightenment","Mystagogy"];
    const STAGE_SHORT = ["Pre-Cat","Catechumenate","P&E","Mystagogy"];
    const STAGE_CLASS = ["stage-pre","stage-cat","stage-pe","stage-mys"];
    function stageClass(s) { return STAGE_CLASS[STAGES.indexOf(s)] || "stage-pre"; }

    // Default teacher account
    const DEFAULT_TEACHER = { email: "teacher@stcatherine.org", password: "ocia2026", name: "Fr. Michael", role: "admin" };

    const SEED_STUDENTS = [
      {id:1,name:"Maria Santos",email:"maria.santos@email.com",password:"maria123",phone:"972-555-0101",stage:"Catechumenate",attendance:85,notes:"Sponsored by John D.",joined:"2025-09-10"},
      {id:2,name:"James Okafor",email:"james.okafor@email.com",password:"james123",phone:"972-555-0102",stage:"Pre-Catechumenate",attendance:70,notes:"Recently moved from Lagos",joined:"2026-01-15"},
      {id:3,name:"Linda Chen",email:"linda.chen@email.com",password:"linda123",phone:"972-555-0103",stage:"Catechumenate",attendance:92,notes:"",joined:"2025-09-10"},
      {id:4,name:"Roberto Diaz",email:"rdiaz@email.com",password:"roberto123",phone:"972-555-0104",stage:"Purification & Enlightenment",attendance:96,notes:"Elect — Easter Vigil ready",joined:"2024-09-05"},
      {id:5,name:"Aisha Williams",email:"aisha.w@email.com",password:"aisha123",phone:"972-555-0105",stage:"Catechumenate",attendance:78,notes:"Sponsor: Deacon Tom",joined:"2025-09-10"},
      {id:6,name:"Patrick Murphy",email:"pmurphy@email.com",password:"patrick123",phone:"972-555-0106",stage:"Mystagogy",attendance:100,notes:"Baptized Easter 2025",joined:"2024-09-01"},
      {id:7,name:"Fatima Al-Hassan",email:"fatima.h@email.com",password:"fatima123",phone:"972-555-0107",stage:"Pre-Catechumenate",attendance:60,notes:"Just inquiring",joined:"2026-03-01"},
      {id:8,name:"David Kim",email:"dkim@email.com",password:"david123",phone:"972-555-0108",stage:"Catechumenate",attendance:88,notes:"",joined:"2025-09-10"},
    ];
    const SEED_ANN = [
      {id:1,title:"Easter Vigil Rehearsal",body:"All elect please attend the Easter Vigil rehearsal on Friday, April 4th at 7:00 pm in the main church. Bring your sponsor!",date:"2026-05-29",urgent:true},
      {id:2,title:"Session this Wednesday",body:"This Wednesday we will cover the Sacrament of Baptism. Please read Chapter 12 in your OCIA workbook beforehand.",date:"2026-06-01",urgent:false},
      {id:3,title:"Retreat Day — June 21",body:"Our annual retreat will be held on Saturday, June 21st. All catechumens are strongly encouraged to attend. Lunch is provided.",date:"2026-05-20",urgent:false},
    ];
    const SEED_MAT = [
      {id:1,name:"OCIA Workbook (Official)",type:"pdf",url:"https://www.usccb.org/sites/default/files/flipbooks/catechism/",category:"Textbook"},
      {id:2,name:"Catechism of the Catholic Church",type:"link",url:"https://www.usccb.org/sites/default/files/flipbooks/catechism/",category:"Reference"},
      {id:3,name:"Week 5 — The Creed Slides",type:"drive",url:"https://drive.google.com/",category:"Slides"},
      {id:4,name:"Prayer Booklet for Catechumens",type:"pdf",url:"https://drive.google.com/",category:"Prayer"},
      {id:5,name:"Diocese of Fort Worth OCIA Guide",type:"link",url:"https://fwdioc.org",category:"Reference"},
    ];
    const SEED_EVT = [
      {id:1,title:"OCIA Session",date:"2026-06-04",time:"7:00 PM",location:"Parish Hall",description:"Regular weekly session",type:"class"},
      {id:2,title:"OCIA Session",date:"2026-06-11",time:"7:00 PM",location:"Parish Hall",description:"",type:"class"},
      {id:3,title:"OCIA Session",date:"2026-06-18",time:"7:00 PM",location:"Parish Hall",description:"",type:"class"},
      {id:4,title:"Retreat Day",date:"2026-06-21",time:"9:00 AM",location:"St. Catherine Parish Center",description:"Full day retreat. Lunch provided. All catechumens strongly encouraged.",type:"retreat"},
      {id:5,title:"OCIA Session",date:"2026-06-25",time:"7:00 PM",location:"Parish Hall",description:"",type:"class"},
      {id:6,title:"Rite of Welcome",date:"2026-07-06",time:"10:30 AM",location:"Main Church",description:"Formal Rite of Welcome for new catechumens",type:"rite"},
    ];
    const SEED_TEACHER = { email: "teacher@stcatherine.org", password: "ocia2026", name: "Fr. Michael" };

    function useStorage(key, seed) {
      const [data, setData] = useState(() => { try { const s=localStorage.getItem(key); return s?JSON.parse(s):seed; } catch{return seed;} });
      const save = (v) => { setData(v); try{localStorage.setItem(key,JSON.stringify(v));}catch{} };
      return [data, save];
    }

    function StageTag({stage}) { return <span className={`badge-stage ${stageClass(stage)}`}>{stage}</span>; }
    function MatIcon({type}) {
      const m={pdf:{bg:"#FEE2E2",ic:"📄"},drive:{bg:"#DBEAFE",ic:"🔗"},link:{bg:"#D1FAE5",ic:"🌐"}};
      const t=m[type]||m.link;
      return <div className="material-icon" style={{background:t.bg}}>{t.ic}</div>;
    }
    function initials(name) { return (name||"").split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase(); }

    function Modal({title,onClose,children,footer}) {
      return (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="modal">
            <div className="modal-header"><h3>{title}</h3><button className="close-btn" onClick={onClose}>×</button></div>
            <div className="modal-body">{children}</div>
            {footer&&<div className="modal-footer">{footer}</div>}
          </div>
        </div>
      );
    }

    // ── LOGIN ──
    function LoginPage({onLogin}) {
      const [email,setEmail]=useState("");
      const [password,setPassword]=useState("");
      const [error,setError]=useState("");
      const [students]=useStorage("ocia_students",SEED_STUDENTS);
      const [teacher]=useStorage("ocia_teacher",SEED_TEACHER);

      const login = () => {
        setError("");
        // Check teacher
        if(email.trim().toLowerCase()===teacher.email.toLowerCase() && password===teacher.password) {
          onLogin({...teacher, role:"admin"});
          return;
        }
        // Check students
        const s = students.find(s=>s.email.toLowerCase()===email.trim().toLowerCase() && s.password===password);
        if(s) { onLogin({...s, role:"student"}); return; }
        setError("Incorrect email or password. Please try again.");
      };

      const handleKey = (e) => { if(e.key==="Enter") login(); };

      return (
        <div className="login-page">
          <div className="login-card">
            <div className="login-logo">
              <div className="cross">✝</div>
              <div className="parish">St. Catherine of Siena</div>
              <h2>OCIA Program</h2>
              <p style={{fontSize:13,color:C.muted,marginTop:4}}>Carrollton, Texas</p>
            </div>
            {error&&<div className="error-msg">{error}</div>}
            <div className="form-group">
              <label className="form-label">Email Address</label>
              <input className="form-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={handleKey} placeholder="your@email.com" autoFocus/>
            </div>
            <div className="form-group">
              <label className="form-label">Password</label>
              <input className="form-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={handleKey} placeholder="••••••••"/>
            </div>
            <button className="btn btn-primary btn-block" onClick={login}>Sign In</button>
            <p style={{textAlign:"center",fontSize:12,color:C.muted,marginTop:16}}>Contact your teacher if you need help logging in.</p>
          </div>
        </div>
      );
    }

    // ── ADMIN VIEWS ──
    function AdminDashboard({students,announcements,events}) {
      const stages=STAGES.map(s=>({name:s,count:students.filter(x=>x.stage===s).length}));
      const avgAtt=students.length?Math.round(students.reduce((a,b)=>a+b.attendance,0)/students.length):0;
      const today=new Date().toISOString().slice(0,10);
      const upcoming=events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
      return (
        <>
          <div className="stats-grid">
            <div className="stat-card"><div className="stat-label">Total Catechumens</div><div className="stat-value">{students.length}</div><div className="stat-sub">Active in program</div></div>
            <div className="stat-card"><div className="stat-label">Avg. Attendance</div><div className="stat-value">{avgAtt}%</div><div className="stat-sub">This term</div></div>
            <div className="stat-card"><div className="stat-label">Ready for Rites</div><div className="stat-value">{students.filter(s=>s.stage==="Purification & Enlightenment").length}</div><div className="stat-sub">P&amp;E stage</div></div>
            <div className="stat-card"><div className="stat-label">Mystagogy</div><div className="stat-value">{students.filter(s=>s.stage==="Mystagogy").length}</div><div className="stat-sub">Newly initiated</div></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,marginBottom:20}}>
            <div className="card">
              <h3 style={{fontSize:16,marginBottom:16}}>Journey Progress</h3>
              {stages.map((s,i)=>(
                <div key={s.name} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                    <span className={`badge-stage ${STAGE_CLASS[i]}`}>{STAGE_SHORT[i]}</span>
                    <span style={{fontSize:13,color:C.muted}}>{s.count} students</span>
                  </div>

    function AdminCalendar({events,setEvents}) {
      const [modal,setModal]=useState(false);
      const [editModal,setEditModal]=useState(false);
      const [form,setForm]=useState({});
      const [popup,setPopup]=useState(null);
      const popupRef=useRef(null);
      const today=new Date();
      const [viewDate,setViewDate]=useState(new Date(today.getFullYear(),today.getMonth(),1));
      const year=viewDate.getFullYear(),month=viewDate.getMonth();
      const firstDay=new Date(year,month,1).getDay();
      const daysInMonth=new Date(year,month+1,0).getDate();
      const daysInPrev=new Date(year,month,0).getDate();
      const todayStr=today.toISOString().slice(0,10);
      const cells=[];
      for(let i=firstDay-1;i>=0;i--)cells.push({day:daysInPrev-i,other:true});
      for(let d=1;d<=daysInMonth;d++)cells.push({day:d,other:false});
      while(cells.length%7!==0)cells.push({day:cells.length-firstDay-daysInMonth+1,other:true});
      const eventsForDay=(d)=>{const ds=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;return events.filter(e=>e.date===ds);};
      const openAdd=()=>{setForm({title:"",date:todayStr,time:"7:00 PM",location:"Parish Hall",description:"",type:"class"});setModal(true);};
      const openEdit=(ev,e)=>{e.stopPropagation();setPopup(null);setForm({...ev});setEditModal(true);};
      const save=()=>{if(!form.title||!form.date)return;setEvents([...events,{...form,id:Date.now()}]);setModal(false);};
      const saveEdit=()=>{if(!form.title||!form.date)return;setEvents(events.map(e=>e.id===form.id?form:e));setEditModal(false);};
      const remove=(id)=>{setEvents(events.filter(e=>e.id!==id));setPopup(null);};
      const showPopup=(ev,e)=>{e.stopPropagation();const r=e.target.getBoundingClientRect();setPopup({ev,x:r.left,y:r.bottom+4});};
      useEffect(()=>{const h=()=>setPopup(null);document.addEventListener("click",h);return()=>document.removeEventListener("click",h);},[]);
      const monthName=viewDate.toLocaleString("en",{month:"long",year:"numeric"});
      const upcoming=events.filter(e=>e.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date));
      const EventForm=({onSave,onClose,title})=>(
        <Modal title={title} onClose={onClose}
          footer={<><button className="btn btn-outline" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={onSave}>Save</button></>}>
          <div className="form-group"><label className="form-label">Event Title</label><input className="form-input" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="OCIA Session, Rite of Welcome…"/></div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Date</label><input className="form-input" type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
            <div className="form-group"><label className="form-label">Time</label><input className="form-input" type="text" value={form.time||""} onChange={e=>setForm({...form,time:e.target.value})} placeholder="7:00 PM"/></div>
          </div>
          <div className="form-row">
            <div className="form-group"><label className="form-label">Location</label><input className="form-input" value={form.location||""} onChange={e=>setForm({...form,location:e.target.value})} placeholder="Parish Hall"/></div>
            <div className="form-group"><label className="form-label">Type</label><select className="form-input" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}><option value="class">Class Session</option><option value="rite">Rite / Liturgy</option><option value="retreat">Retreat</option><option value="meeting">Meeting</option><option value="other">Other</option></select></div>
          </div>
          <div className="form-group"><label className="form-label">Description / Notes</label><textarea className="form-input" rows={3} value={form.description||""} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Any details students should know…" style={{resize:"vertical"}}/></div>
        </Modal>
      );
      return (
        <>
          <div className="section-header"><h2>Class Calendar</h2><button className="btn btn-primary" onClick={openAdd}>+ Add Event</button></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:20}}>
            <div className="card">
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                <h3 style={{fontSize:17}}>{monthName}</h3>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn btn-outline btn-sm" onClick={()=>setViewDate(new Date(year,month-1,1))}>‹ Prev</button>
                  <button className="btn btn-outline btn-sm" onClick={()=>setViewDate(new Date(year,month+1,1))}>Next ›</button>
                </div>
              </div>
              <div className="cal-grid">
                {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><div key={d} className="cal-day-header">{d}</div>)}
                {cells.map((cell,i)=>{
                  const ds=cell.other?null:`${year}-${String(month+1).padStart(2,"0")}-${String(cell.day).padStart(2,"0")}`;
                  const evs=cell.other?[]:eventsForDay(cell.day);
                  return (
                    <div key={i} className={`cal-day${cell.other?" other-month":""}${ds===todayStr?" today":""}`}>
                      <div className="cal-date" style={{color:ds===todayStr?C.gold:C.navy}}>{cell.day}</div>
                      {evs.map(ev=><div key={ev.id} className="cal-event" title={ev.title} onClick={(e)=>showPopup(ev,e)}>{ev.title}</div>)}
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="card">
              <h3 style={{fontSize:15,marginBottom:14}}>Upcoming</h3>
              {upcoming.length===0&&<p style={{fontSize:13,color:C.muted}}>No upcoming events</p>}
              {upcoming.map(ev=>(
                <div key={ev.id} style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:500}}>{ev.title}</div>
                    <div style={{fontSize:11,color:C.muted}}>{ev.date}{ev.time&&` · ${ev.time}`}</div>
                    {ev.location&&<div style={{fontSize:11,color:C.muted}}>📍 {ev.location}</div>}
                  </div>
                  <div style={{display:"flex",gap:4,flexShrink:0,marginLeft:6}}>
                    <button className="btn btn-outline btn-sm" onClick={(e)=>openEdit(ev,e)} style={{fontSize:11,padding:"3px 8px"}}>Edit</button>
                    <button className="btn btn-danger btn-sm" onClick={()=>remove(ev.id)} style={{fontSize:11,padding:"3px 8px"}}>✕</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
          {modal&&<EventForm title="Add Event" onSave={save} onClose={()=>setModal(false)}/>}
          {editModal&&<EventForm title="Edit Event" onSave={saveEdit} onClose={()=>setEditModal(false)}/>}
          {popup&&(
            <div className="event-popup" ref={popupRef} style={{top:Math.min(popup.y,window.innerHeight-200),left:Math.min(popup.x,window.innerWidth-300)}} onClick={e=>e.stopPropagation()}>
              <h4>{popup.ev.title}</h4>
              {popup.ev.date&&<div className="event-detail-row"><span>📅</span><span>{popup.ev.date}{popup.ev.time&&` at ${popup.ev.time}`}</span></div>}
              {popup.ev.location&&<div className="event-detail-row"><span>📍</span><span>{popup.ev.location}</span></div>}
              {popup.ev.description&&<div className="event-detail-row"><span>📝</span><span>{popup.ev.description}</span></div>}
              <div style={{display:"flex",gap:6,marginTop:12}}>
                <button className="btn btn-outline btn-sm" style={{flex:1}} onClick={(e)=>openEdit(popup.ev,e)}>Edit</button>
                <button className="btn btn-danger btn-sm" style={{flex:1}} onClick={()=>remove(popup.ev.id)}>Delete</button>
              </div>
            </div>
          )}
        </>
      );
    }

                return (
                  <div key={s} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                    <div style={{width:20,height:20,borderRadius:"50%",background:done?C.success:current?C.gold:C.border,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:done||current?C.white:C.muted,flexShrink:0}}>{done?"✓":i+1}</div>
                    <span style={{fontSize:13,fontWeight:current?500:400,color:current?C.navy:C.muted}}>{s}</span>
                    {current&&<span style={{fontSize:10,background:C.goldLight,color:C.navy,padding:"1px 7px",borderRadius:10,fontWeight:600}}>Current</span>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="two-col">
            <div className="card">
              <h3 style={{fontSize:16,marginBottom:14}}>Latest Announcements</h3>
              {announcements.slice(0,3).map(a=>(
                <div key={a.id} className="announcement">
                  <div className="ann-meta">{a.date}{a.urgent&&<span style={{color:C.danger,fontWeight:600}}> · Urgent</span>}</div>
                  <div style={{fontWeight:500,fontSize:14,marginBottom:3}}>{a.title}</div>
                  <div className="ann-body">{a.body}</div>
                </div>
              ))}
            </div>
            <div className="card">
              <h3 style={{fontSize:16,marginBottom:14}}>Upcoming Sessions</h3>
              {upcoming.map(ev=>(
                <div key={ev.id} style={{padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                  <div style={{display:"flex",gap:12,alignItems:"center"}}>
                    <div style={{background:C.cream,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 10px",textAlign:"center",minWidth:44,flexShrink:0}}>
                      <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:1,color:C.muted}}>{new Date(ev.date+"T12:00:00").toLocaleString("en",{month:"short"})}</div>
                      <div style={{fontSize:18,fontFamily:"Playfair Display,serif",fontWeight:700,color:C.navy,lineHeight:1}}>{new Date(ev.date+"T12:00:00").getDate()}</div>
                    </div>
                    <div>
                      <div style={{fontSize:14,fontWeight:500}}>{ev.title}</div>
                      {ev.time&&<div style={{fontSize:12,color:C.muted}}>🕖 {ev.time}</div>}
                      {ev.location&&<div style={{fontSize:12,color:C.muted}}>📍 {ev.location}</div>}
                    </div>
                  </div>
                  {ev.description&&<div style={{marginTop:6,fontSize:12,color:C.muted,paddingLeft:56}}>{ev.description}</div>}
                </div>
              ))}
              {upcoming.length===0&&<div className="empty"><div className="empty-icon">📅</div><p>No upcoming events</p></div>}
            </div>
          </div>
        </>
      );
    }

    function StudentMaterials({materials}) {
      const cats=[...new Set(materials.map(m=>m.category))];
      return (
        <>
          <div className="section-header"><h2>Materials &amp; Resources</h2></div>
          {cats.map(cat=>(
            <div key={cat} style={{marginBottom:24}}>
              <h3 style={{fontSize:15,color:C.muted,marginBottom:12,textTransform:"uppercase",letterSpacing:1,fontFamily:"Source Sans 3,sans-serif",fontWeight:500}}>{cat}</h3>
              {materials.filter(m=>m.category===cat).map(m=>(
                <div key={m.id} className="material-item">
                  <MatIcon type={m.type}/>
                  <div className="material-info"><div className="material-name">{m.name}</div><div className="material-meta">{m.type==="pdf"?"PDF Document":m.type==="drive"?"Google Drive":"External Link"}</div></div>
                  <a href={m.url} target="_blank" rel="noreferrer"><button className="btn btn-gold btn-sm">Open ↗</button></a>
                </div>
              ))}
            </div>
          ))}
          {materials.length===0&&<div className="empty"><div className="empty-icon">📚</div><p>No materials uploaded yet</p></div>}
        </>
      );
    }

    function StudentAnnouncements({announcements}) {
      return (
        <>
          <div className="section-header"><h2>Announcements</h2></div>
          {announcements.map(a=>(
            <div key={a.id} className="announcement">
              <div className="ann-meta">{a.date}{a.urgent&&<span style={{color:C.danger,fontWeight:600}}> · Urgent</span>}</div>
              <div style={{fontWeight:500,fontSize:15,marginBottom:4}}>{a.title}</div>
              <div className="ann-body">{a.body}</div>
            </div>
          ))}
          {announcements.length===0&&<div className="empty"><div className="empty-icon">📢</div><p>No announcements yet</p></div>}
        </>
      );
    }

    function StudentCalendar({events}) {
      const today=new Date();
      const [viewDate,setViewDate]=useState(new Date(today.getFullYear(),today.getMonth(),1));
      const [selected,setSelected]=useState(null);
      const year=viewDate.getFullYear(),month=viewDate.getMonth();
      const firstDay=new Date(year,month,1).getDay();
      const daysInMonth=new Date(year,month+1,0).getDate();
      const daysInPrev=new Date(year,month,0).getDate();
      const todayStr=today.toISOString().slice(0,10);
      const cells=[];
      for(let i=firstDay-1;i>=0;i--)cells.push({day:daysInPrev-i,other:true});
      for(let d=1;d<=daysInMonth;d++)cells.push({day:d,other:false});
      while(cells.length%7!==0)cells.push({day:cells.length-firstDay-daysInMonth+1,other:true});
      const eventsForDay=(d)=>{const ds=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;return events.filter(e=>e.date===ds);};
      const upcoming=events.filter(e=>e.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date));
      return (
        <>
          <div className="section-header"><h2>Class Calendar</h2></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:20}}>
            <div className="card">
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
                <h3 style={{fontSize:17}}>{viewDate.toLocaleString("en",{month:"long",year:"numeric"})}</h3>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn btn-outline btn-sm" onClick={()=>setViewDate(new Date(year,month-1,1))}>‹ Prev</button>
                  <button className="btn btn-outline btn-sm" onClick={()=>setViewDate(new Date(year,month+1,1))}>Next ›</button>
                </div>
              </div>
              <div className="cal-grid">
                {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><div key={d} className="cal-day-header">{d}</div>)}
                {cells.map((cell,i)=>{
                  const ds=cell.other?null:`${year}-${String(month+1).padStart(2,"0")}-${String(cell.day).padStart(2,"0")}`;
                  const evs=cell.other?[]:eventsForDay(cell.day);
                  return (
                    <div key={i} className={`cal-day${cell.other?" other-month":""}${ds===todayStr?" today":""}`}>
                      <div className="cal-date" style={{color:ds===todayStr?C.gold:C.navy}}>{cell.day}</div>
                      {evs.map(ev=><div key={ev.id} className="cal-event" onClick={()=>setSelected(ev)}>{ev.title}</div>)}
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="card">
              <h3 style={{fontSize:15,marginBottom:14}}>Upcoming</h3>
              {upcoming.map(ev=>(
                <div key={ev.id} style={{padding:"10px 0",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}} onClick={()=>setSelected(ev)}>
                  <div style={{fontSize:13,fontWeight:500,color:C.navy}}>{ev.title}</div>
                  <div style={{fontSize:11,color:C.muted}}>{ev.date}{ev.time&&` · ${ev.time}`}</div>
                  {ev.location&&<div style={{fontSize:11,color:C.muted}}>📍 {ev.location}</div>}
                </div>
              ))}
              {upcoming.length===0&&<p style={{fontSize:13,color:C.muted}}>No upcoming events</p>}
            </div>
          </div>
          {selected&&(
            <Modal title={selected.title} onClose={()=>setSelected(null)}
              footer={<button className="btn btn-primary" onClick={()=>setSelected(null)}>Close</button>}>
              {selected.date&&<div className="event-detail-row" style={{marginBottom:10,fontSize:14}}><span>📅</span><span>{selected.date}{selected.time&&` at ${selected.time}`}</span></div>}
              {selected.location&&<div className="event-detail-row" style={{marginBottom:10,fontSize:14}}><span>📍</span><span>{selected.location}</span></div>}
              {selected.description&&<div style={{marginTop:10,padding:12,background:C.cream,borderRadius:8,fontSize:14,color:C.navy,lineHeight:1.6}}>{selected.description}</div>}
            </Modal>
          )}
        </>
      );
    }

    // ── SETTINGS ──
    function AdminSettings({teacher,setTeacher}) {
      const [form,setForm]=useState({...teacher});
      const [saved,setSaved]=useState(false);
      const save=()=>{setTeacher(form);setSaved(true);setTimeout(()=>setSaved(false),2000);};
      return (
        <>
          <div className="section-header"><h2>Settings</h2></div>
          <div className="card" style={{maxWidth:480}}>
            <h3 style={{fontSize:16,marginBottom:16}}>Teacher Account</h3>
            <div className="form-group"><label className="form-label">Your Name</label><input className="form-input" value={form.name||""} onChange={e=>setForm({...form,name:e.target.value})}/></div>
            <div className="form-group"><label className="form-label">Login Email</label><input className="form-input" type="email" value={form.email||""} onChange={e=>setForm({...form,email:e.target.value})}/></div>
            <div className="form-group"><label className="form-label">Password</label><input className="form-input" type="text" value={form.password||""} onChange={e=>setForm({...form,password:e.target.value})}/></div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <button className="btn btn-primary" onClick={save}>Save Changes</button>
              {saved&&<span style={{fontSize:13,color:C.success}}>✓ Saved!</span>}
            </div>
          </div>
        </>
      );
    }

    // ── MAIN APP ──
    function App() {
      const [students,setStudents]=useStorage("ocia_students",SEED_STUDENTS);
      const [announcements,setAnnouncements]=useStorage("ocia_announcements",SEED_ANN);
      const [materials,setMaterials]=useStorage("ocia_materials",SEED_MAT);
      const [events,setEvents]=useStorage("ocia_events",SEED_EVT);
      const [teacher,setTeacher]=useStorage("ocia_teacher",SEED_TEACHER);
      const [currentUser,setCurrentUser]=useState(null);
      const [page,setPage]=useState("dashboard");

      if(!currentUser) return <LoginPage onLogin={(u)=>{setCurrentUser(u);setPage("dashboard");}}/>;

      const isAdmin=currentUser.role==="admin";
      const adminNav=[{id:"dashboard",label:"Dashboard",icon:"🏠"},{id:"students",label:"Catechumens",icon:"👥"},{id:"announcements",label:"Announcements",icon:"📢"},{id:"materials",label:"Materials",icon:"📚"},{id:"calendar",label:"Calendar",icon:"📅"},{id:"settings",label:"Settings",icon:"⚙️"}];
      const studentNav=[{id:"dashboard",label:"My Journey",icon:"✝"},{id:"announcements",label:"Announcements",icon:"📢"},{id:"materials",label:"Materials",icon:"📚"},{id:"calendar",label:"Calendar",icon:"📅"}];
      const nav=isAdmin?adminNav:studentNav;
      const titles={dashboard:isAdmin?"Overview":"My Journey",students:"Catechumens",announcements:"Announcements",materials:"Materials & Downloads",calendar:"Class Calendar",settings:"Settings"};

      // Get fresh student data for logged-in student
      const liveStudent=isAdmin?null:(students.find(s=>s.id===currentUser.id)||currentUser);

      return (
        <div className="app">
          <div className="sidebar">
            <div className="sidebar-logo">
              <div className="parish">St. Catherine of Siena</div>
              <h2>OCIA<br/>Program</h2>
              <span className="badge">Carrollton, TX</span>
            </div>
            <div className="sidebar-nav">
              {nav.map(item=>(
                <div key={item.id} className={`nav-item${page===item.id?" active":""}`} onClick={()=>setPage(item.id)}>
                  <span className="nav-icon">{item.icon}</span>{item.label}
                </div>
              ))}
            </div>
            <div className="sidebar-footer">
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <div style={{width:28,height:28,borderRadius:"50%",background:"rgba(255,255,255,0.12)",color:C.goldLight,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:600,flexShrink:0}}>{initials(currentUser.name)}</div>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,color:C.white,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{currentUser.name}</div><div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>{isAdmin?"Teacher":"Student"}</div></div>
              </div>
              <button className="logout-btn" style={{width:"100%",justifyContent:"center"}} onClick={()=>{setCurrentUser(null);setPage("dashboard");}}>Sign Out</button>
            </div>
          </div>
          <div className="main">
            <div className="topbar">
              <div className="topbar-title">{titles[page]}</div>
              <div className="topbar-right">
                <span style={{fontSize:13,color:C.muted}}>{currentUser.name}</span>
                <div className="avatar">{initials(currentUser.name)}</div>
              </div>
            </div>
            <div className="content">
              {isAdmin&&page==="dashboard"&&<AdminDashboard students={students} announcements={announcements} events={events}/>}
              {isAdmin&&page==="students"&&<AdminStudents students={students} setStudents={setStudents}/>}
              {isAdmin&&page==="announcements"&&<AdminAnnouncements announcements={announcements} setAnnouncements={setAnnouncements}/>}
              {isAdmin&&page==="materials"&&<AdminMaterials materials={materials} setMaterials={setMaterials}/>}
              {isAdmin&&page==="calendar"&&<AdminCalendar events={events} setEvents={setEvents}/>}
              {isAdmin&&page==="settings"&&<AdminSettings teacher={teacher} setTeacher={setTeacher}/>}
              {!isAdmin&&page==="dashboard"&&<StudentDashboard student={liveStudent} announcements={announcements} events={events}/>}
              {!isAdmin&&page==="announcements"&&<StudentAnnouncements announcements={announcements}/>}
              {!isAdmin&&page==="materials"&&<StudentMaterials materials={materials}/>}
              {!isAdmin&&page==="calendar"&&<StudentCalendar events={events}/>}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
