<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const C = {
    navy:"#3D2C6B", gold:"#9B7FD4", goldLight:"#DDD0F5", cream:"#F7F4FC",
    white:"#FFF", muted:"#7B6FA0", border:"#DDD5EE", danger:"#B84040", success:"#2E7D5A",
  };

  const DEFAULT_STAGES = ["Pre-Catechumenate","Catechumenate","Purification & Enlightenment","Mystagogy"];
  const STAGE_CLASS = ["stage-pre","stage-cat","stage-pe","stage-mys","stage-pre","stage-cat","stage-pe","stage-mys"];

  // ── FIREBASE HELPERS ──
  function useCollection(colName, seedData) {
    const [data, setData] = useState(null);
    useEffect(() => {
      const db = window.__db;
      const { collection, onSnapshot, setDoc, doc, getDoc } = window.__firebase;
      if (!db) return;
      const col = collection(db, colName);
      const unsub = onSnapshot(col, async snap => {
        if (snap.empty && seedData && seedData.length > 0) {
          // Check Firebase if this collection was ever initialized
          const initDoc = await getDoc(doc(db, "config", `init_${colName}`));
          if (!initDoc.exists()) {
            // First time ever — seed and mark as initialized
            await setDoc(doc(db, "config", `init_${colName}`), { initialized: true });
            for (const item of seedData) {
              await setDoc(doc(db, colName, String(item.id)), item);
            }
          } else {
            // Was initialized before — just show empty list
            setData([]);
          }
        } else {
          setData(snap.docs.map(d => d.data()));
        }
      });
      return unsub;
    }, [colName]);
    return data;
  }

  async function saveItem(colName, item) {
    const { doc, setDoc } = window.__firebase;
    const db = window.__db;
    await setDoc(doc(db, colName, String(item.id)), item);
  }

  async function removeItem(colName, id) {
    const { doc, deleteDoc } = window.__firebase;
    const db = window.__db;
    await deleteDoc(doc(db, colName, String(id)));
  }

  async function saveConfig(key, value) {
    const { doc, setDoc } = window.__firebase;
    const db = window.__db;
    await setDoc(doc(db, "config", key), { value });
  }

  function useConfig(key, defaultValue) {
    const [value, setValue] = useState(defaultValue);
    useEffect(() => {
      const db = window.__db;
      const { doc, onSnapshot } = window.__firebase;
      if (!db) return;
      const unsub = onSnapshot(doc(db, "config", key), snap => {
        if (snap.exists()) setValue(snap.data().value);
        else setValue(defaultValue);
      });
      return unsub;
    }, [key]);
    return [value, (v) => { setValue(v); saveConfig(key, v); }];
  }

  // ── SEED DATA ──
  const SEED_STUDENTS = [
    {id:1,name:"Maria Santos",email:"maria.santos@email.com",phone:"972-555-0101",stage:"Catechumenate",attendance:85,notes:"Sponsored by John D.",joined:"2025-09-10"},
    {id:2,name:"James Okafor",email:"james.okafor@email.com",phone:"972-555-0102",stage:"Pre-Catechumenate",attendance:70,notes:"",joined:"2026-01-15"},
    {id:3,name:"Linda Chen",email:"linda.chen@email.com",phone:"972-555-0103",stage:"Catechumenate",attendance:92,notes:"",joined:"2025-09-10"},
  ];
  const SEED_ANN = [
    {id:1,title:"Session this Wednesday",body:"This Wednesday we will cover the Sacrament of Baptism. Please read Chapter 12 beforehand.",date:"2026-06-01",urgent:false},
    {id:2,title:"Retreat Day — June 21",body:"Our annual retreat will be held on Saturday, June 21st. All catechumens are strongly encouraged to attend.",date:"2026-05-20",urgent:false},
  ];
  const SEED_MAT = [
    {id:1,name:"Catechism of the Catholic Church",type:"link",url:"https://www.usccb.org/sites/default/files/flipbooks/catechism/",category:"Reference"},
    {id:2,name:"Prayer Booklet for Catechumens",type:"pdf",url:"https://drive.google.com/",category:"Prayer"},
  ];
  const SEED_EVT = [
    {id:1,date:"2026-06-04",content:"Introduction to the OCIA Process",catechist:""},
    {id:2,date:"2026-06-11",content:"The Sacrament of Baptism",catechist:""},
    {id:3,date:"2026-06-18",content:"The Creed — What Catholics Believe",catechist:""},
  ];

  function initials(name) { return (name||"").split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase(); }
  function StageTag({stage,stages=DEFAULT_STAGES}) { return <span className={`badge-stage ${STAGE_CLASS[stages.indexOf(stage)%STAGE_CLASS.length]||"stage-pre"}`}>{stage}</span>; }
  function MatIcon({type}) {
    const m={pdf:{bg:"#FEE2E2",ic:"📄"},drive:{bg:"#DBEAFE",ic:"🔗"},link:{bg:"#D1FAE5",ic:"🌐"}};
    const t=m[type]||m.link;
    return <div className="material-icon" style={{background:t.bg}}>{t.ic}</div>;
  }

  function Modal({title,onClose,children}) {
    return (
      <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>

  function ModalButtons({onCancel,onSave,saveLabel="Save"}) {

        <button className="btn btn-outline" style={{flex:1}} onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary" style={{flex:2}} onClick={onSave}>✓ {saveLabel}</button>

  // ── LOGIN ──
  function LoginPage({onLogin}) {
    const [role,setRole]=useState(null);

    const [showPw,setShowPw]=useState(false);
    const [error,setError]=useState("");

    const login=()=>{
      setError("");
      if(role==="admin"&&password.trim().toLowerCase()==="ruby"){onLogin({name:"Admin",role:"admin"});return;}
      if(role==="catechist"&&password.trim().toLowerCase()==="jesus"){onLogin({name:"Catechist",role:"catechist"});return;}
      setError("Incorrect password.");
    };

    const roles=[
      {r:"admin",    label:"Admin",     color:"#3D2C6B", light:"#EDE9FE", border:"#9B7FD4"},
      {r:"catechist",label:"Catechist", color:"#065F46", light:"#D1FAE5", border:"#34D399"},
      {r:"student",  label:"Student",   color:"#1E40AF", light:"#DBEAFE", border:"#60A5FA"},
    ];

    return (
      <div style={{minHeight:"100dvh",background:"linear-gradient(135deg,#3D2C6B 0%,#6D4C9E 50%,#9B7FD4 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#FFFFFF",borderRadius:24,padding:"40px 36px",width:"100%",maxWidth:420,boxShadow:"0 32px 80px rgba(0,0,0,0.35)"}}>

          {/* Logo */}
          <div style={{textAlign:"center",marginBottom:32}}>
            <div style={{width:64,height:64,borderRadius:"50%",background:"linear-gradient(135deg,#3D2C6B,#9B7FD4)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",boxShadow:"0 8px 24px rgba(61,44,107,0.35)"}}>
              <span style={{fontSize:28,color:"#FFF"}}>✝</span>
            </div>
            <div style={{fontSize:11,letterSpacing:2,textTransform:"uppercase",color:"#9B7FD4",marginBottom:4}}>St. Catherine of Siena</div>
            <h2 style={{fontFamily:"Playfair Display,serif",fontSize:26,color:"#3D2C6B",marginBottom:2}}>OCIA Program</h2>
            <p style={{fontSize:13,color:"#7B6FA0"}}>Carrollton, Texas</p>
          </div>

          <p style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:2,color:"#7B6FA0",textAlign:"center",marginBottom:16}}>Login as</p>

          {/* Role buttons */}
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:20}}>
            {roles.map(({r,label,color,light,border})=>(
              <button key={r} onClick={()=>{setRole(r);setPassword("");setError("");}}
                style={{width:"100%",padding:"15px 20px",borderRadius:12,border:`2px solid ${role===r?border:"#E5E7EB"}`,background:role===r?light:"#F9FAFB",cursor:"pointer",fontSize:16,fontWeight:600,color:role===r?color:"#374151",fontFamily:"Source Sans 3,sans-serif",transition:"all 0.15s",textAlign:"center"}}>
                {label}
              </button>
            ))}
          </div>

          {/* Password field — only for admin and catechist */}
          {(role==="admin"||role==="catechist")&&(
            <div style={{marginBottom:12}}>
              {error&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",color:"#DC2626",padding:"10px 14px",borderRadius:8,fontSize:13,marginBottom:12}}>{error}</div>}
              <label style={{display:"block",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:1,color:"#7B6FA0",marginBottom:6}}>Password</label>
              <div style={{position:"relative",marginBottom:12}}>
                <input style={{width:"100%",padding:"12px 44px 12px 14px",border:"2px solid #DDD5EE",borderRadius:10,fontSize:16,fontFamily:"Source Sans 3,sans-serif",color:"#3D2C6B",background:"#F7F4FC",outline:"none",WebkitAppearance:"none"}}
                  type={showPw?"text":"password"} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="••••••••" autoFocus/>
                <button onClick={()=>setShowPw(v=>!v)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#7B6FA0"}}>{showPw?"🙈":"👁️"}</button>
              </div>
            </div>
          )}

          {/* Sign In button — shown for all roles once selected */}
          {role&&(
            <button onClick={role==="student"?()=>onLogin({name:"Student",role:"student"}):login}
              style={{width:"100%",padding:"13px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#3D2C6B,#9B7FD4)",color:"#FFF",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"Source Sans 3,sans-serif",boxShadow:"0 4px 16px rgba(61,44,107,0.35)"}}>
              Sign In
            </button>
          )}
        </div>
      </div>
    );
  }

<title>Name Tags — St. Catherine of Siena</title><style>
@page{size:letter portrait;margin:0}
*{box-sizing:border-box;margin:0;padding:0}

          <div className="stat-card"><div className="stat-label">Announcements</div><div className="stat-value">{(announcements||[]).length}</div><div className="stat-sub">Posted</div></div>
          <div className="stat-card"><div className="stat-label">Sessions</div><div className="stat-value">{(events||[]).length}</div><div className="stat-sub">Scheduled</div></div>

                  <div className="progress-bar"><div className="progress-fill" style={{width:`${(students||[]).length?(count/(students||[]).length)*100:0}%`}}/></div>

              <div key={ev.id} style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:12}}>

            <div className="form-group">
              <label className="form-label">Event Date (shown on tag)</label>
              <input className="form-input" value={tagDate} onChange={e=>setTagDate(e.target.value)} placeholder="e.g. June 4, 2026"/>

            <ModalButtons onCancel={()=>setNameTagModal(false)} onSave={printNameTags} saveLabel="🖨️ Print Name Tags"/>
          </Modal>
        )}
      </>
    );
  }

  // ── ADMIN STUDENTS ──
  function AdminStudents({students,stages}) {
    const [search,setSearch]=useState("");
    const [stageFilter,setStageFilter]=useState([]);
    const [showStageMenu,setShowStageMenu]=useState(false);
    const [modal,setModal]=useState(null);
    const [form,setForm]=useState({});
    const [saveError,setSaveError]=useState("");
    const filtered=(students||[]).filter(s=>{
      const full=`${s.firstName||""} ${s.lastName||""} ${s.name||""}`.toLowerCase();
      const stageMatch=stageFilter.length===0||stageFilter.includes(s.stage);
      return stageMatch&&(full.includes(search.toLowerCase())||(s.email||"").toLowerCase().includes(search.toLowerCase()));
    }).sort((a,b)=>(a.lastName||"").localeCompare(b.lastName||""));
    const openAdd=()=>{setForm({firstName:"",lastName:"",email:"",phone:"",stage:(stages||DEFAULT_STAGES)[0],notes:"",address:"",startDay:"",sacramentDate:"",sacramentsNeeded:[],maritalStatus:"",sponsor:"",confirmationName:"",dob:""});setSaveError("");setModal("add");};
    const openEdit=(s)=>{setForm({...s});setSaveError("");setModal("edit");};
    const openView=(s)=>{setForm({...s});setModal("view");};
    const save=async()=>{
      if(!form.lastName&&!form.firstName){setSaveError("Please enter the student's name.");return;}
      setSaveError("");
      const item={...form,name:`${form.firstName||""} ${form.lastName||""}`.trim(),id:form.id||Date.now(),joined:form.joined||new Date().toISOString().slice(0,10)};
      await saveItem("students",item);
      setModal(null);
    };
    const remove=async(id)=>{if(confirm("Remove this student?"))await removeItem("students",id);};

    const calcAge=(dob)=>{if(!dob)return"—";const b=new Date(dob);const today=new Date();let age=today.getFullYear()-b.getFullYear();if(today<new Date(today.getFullYear(),b.getMonth(),b.getDate()))age--;return age;};

    const sendEmail=()=>{
      const targets=stageFilter.length===0
        ? (students||[])
        : (students||[]).filter(s=>stageFilter.includes(s.stage));
      const emails=targets.filter(s=>s.email).map(s=>s.email).join(";");
      if(!emails){alert("No student emails found for this group.");return;}
      window.location.href=`mailto:${emails}`;
    };

    return (
      <>
        <div className="section-header">
          <h2>OCIA Students</h2>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-input" placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
            {/* Stage checklist */}
            <div style={{position:"relative"}}>
              <button className="btn btn-outline" onClick={()=>setShowStageMenu(v=>!v)}>
                {stageFilter.length===0?"All Stages":stageFilter.length===1?stageFilter[0]:`${stageFilter.length} Stages`} ▾
              </button>
              {showStageMenu&&(
                <div style={{position:"absolute",top:"100%",left:0,marginTop:4,background:C.white,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",zIndex:50,minWidth:220,boxShadow:"0 4px 16px rgba(0,0,0,0.1)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:1,color:C.muted}}>Filter by Stage</span>
                    <button onClick={()=>setStageFilter([])} style={{fontSize:11,color:C.gold,background:"none",border:"none",cursor:"pointer"}}>Clear</button>
                  </div>
                  {(stages||DEFAULT_STAGES).map(s=>(
                    <div key={s} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <input type="checkbox" id={`sf_${s}`} checked={stageFilter.includes(s)}
                        onChange={e=>setStageFilter(f=>e.target.checked?[...f,s]:f.filter(x=>x!==s))}/>
                      <label htmlFor={`sf_${s}`} style={{fontSize:13,cursor:"pointer"}}>{s}</label>
                    </div>
                  ))}
                  <button className="btn btn-primary btn-sm" style={{width:"100%",marginTop:4}} onClick={()=>setShowStageMenu(false)}>Done</button>
                </div>
              )}
            </div>
            <button className="btn btn-outline" onClick={sendEmail}>✉️ Email</button>
            <button className="btn btn-primary" onClick={openAdd}>+ Add</button>
          </div>
        </div>
        <div className="card" style={{padding:0}}>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Last Name</th><th>First Name</th><th>Email</th><th>Phone</th><th>Stage</th><th>Sponsor</th><th>Confirmation Name</th><th></th></tr></thead>
              <tbody>
                {filtered.length===0&&<tr><td colSpan={8}><div className="empty"><div className="empty-icon">👤</div><p>No students found</p></div></td></tr>}
                {filtered.map(s=>(
                  <tr key={s.id}>
                    <td><span style={{fontWeight:500,fontSize:13}}>{s.lastName||s.name||"—"}</span></td>
                    <td><span style={{fontSize:13}}>{s.firstName||"—"}</span></td>
                    <td><a href={`mailto:${s.email}`} style={{color:"#5B3FBE",textDecoration:"none",fontSize:13}}>{s.email}</a></td>
                    <td style={{fontSize:13}}><a href={`tel:${s.phone}`} style={{color:C.navy,textDecoration:"none"}}>{s.phone}</a></td>
                    <td><StageTag stage={s.stage} stages={stages}/></td>
                    <td style={{fontSize:13}}>{s.sponsor||"—"}</td>
                    <td style={{fontSize:13}}>{s.confirmationName||"—"}</td>
                    <td><div style={{display:"flex",gap:4}}><button className="btn btn-outline btn-sm" onClick={()=>openView(s)}>View</button><button className="btn btn-outline btn-sm" onClick={()=>openEdit(s)}>Edit</button><button className="btn btn-danger btn-sm" onClick={()=>remove(s.id)}>✕</button></div></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
        {(modal==="add"||modal==="edit")&&(
          <Modal title={modal==="add"?"Add New Student":"Edit Student"} onClose={()=>setModal(null)}>
            {saveError&&<div className="error-msg">{saveError}</div>}
            <div className="form-row">
              <div className="form-group"><label className="form-label">First Name</label><input className="form-input" value={form.firstName||""} onChange={e=>setForm(f=>({...f,firstName:e.target.value}))} placeholder="First name"/></div>
              <div className="form-group"><label className="form-label">Last Name</label><input className="form-input" value={form.lastName||""} onChange={e=>setForm(f=>({...f,lastName:e.target.value}))} placeholder="Last name"/></div>
            </div>
            <div className="form-group"><label className="form-label">Phone</label><input className="form-input" value={form.phone||""} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="972-555-0100"/></div>
            <div className="form-group"><label className="form-label">Email</label><input className="form-input" type="email" value={form.email||""} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="email@example.com"/></div>
            <div className="form-group"><label className="form-label">Home Address</label><input className="form-input" value={form.address||""} onChange={e=>setForm(f=>({...f,address:e.target.value}))} placeholder="Street, City, State, ZIP"/></div>
            <div className="form-group"><label className="form-label">Date of Birth</label><input className="form-input" type="date" value={form.dob||""} onChange={e=>setForm(f=>({...f,dob:e.target.value}))}/></div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Stage</label><select className="form-input" value={form.stage||(stages||DEFAULT_STAGES)[0]} onChange={e=>setForm(f=>({...f,stage:e.target.value}))}>{(stages||DEFAULT_STAGES).map(s=><option key={s}>{s}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Start Date</label><input className="form-input" type="date" value={form.startDay||""} onChange={e=>setForm(f=>({...f,startDay:e.target.value}))}/></div>
            </div>
            <div className="form-group"><label className="form-label">Date of Sacrament(s) Received</label><input className="form-input" type="date" value={form.sacramentDate||""} onChange={e=>setForm(f=>({...f,sacramentDate:e.target.value}))}/></div>
            <div className="form-group">
              <label className="form-label">Sacraments Needed</label>

                  <input type="checkbox" id={`sn_${opt}`} checked={(form.sacramentsNeeded||[]).includes(opt)}
                    onChange={e=>{const cur=form.sacramentsNeeded||[];setForm(f=>({...f,sacramentsNeeded:e.target.checked?[...cur,opt]:cur.filter(x=>x!==opt)}));}}/>
                  <label htmlFor={`sn_${opt}`} style={{fontSize:14,cursor:"pointer"}}>{opt}</label>
                </div>
              ))}
            </div>
            <div className="form-group">
              <label className="form-label">Current Marital Status</label>
              {["Single","Married","Widowed","Divorced/Separated"].map(opt=>(
                <div key={opt} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <input type="checkbox" id={`ms_${opt}`} checked={(form.maritalStatus||"")===opt}
                    onChange={e=>setForm(f=>({...f,maritalStatus:e.target.checked?opt:""}))}/>
                  <label htmlFor={`ms_${opt}`} style={{fontSize:14,cursor:"pointer"}}>{opt}</label>
                </div>
              ))}
            </div>
            <div className="form-group"><label className="form-label">Notes</label><textarea className="form-input" rows={2} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} style={{resize:"vertical"}}/></div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Sponsor</label><input className="form-input" value={form.sponsor||""} onChange={e=>setForm(f=>({...f,sponsor:e.target.value}))} placeholder="Sponsor name"/></div>
              <div className="form-group"><label className="form-label">Confirmation Name</label><input className="form-input" value={form.confirmationName||""} onChange={e=>setForm(f=>({...f,confirmationName:e.target.value}))} placeholder="Saint name"/></div>
            </div>
            <ModalButtons onCancel={()=>setModal(null)} onSave={save}/>
          </Modal>
        )}
        {modal==="view"&&(
          <Modal title="Student Profile" onClose={()=>setModal(null)}>
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
              <div style={{width:48,height:48,borderRadius:"50%",background:C.navy,color:C.goldLight,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:700}}>{((form.firstName||"")[0]||"")}{((form.lastName||"")[0]||"")}</div>
              <div><div style={{fontFamily:"Playfair Display,serif",fontSize:18}}>{form.firstName} {form.lastName}</div><StageTag stage={form.stage} stages={stages}/></div>
            </div>
            {[["First Name",form.firstName||"—"],["Last Name",form.lastName||"—"],["Date of Birth",form.dob||"—"],["Age",calcAge(form.dob)],["Email",form.email||"—"],["Phone",form.phone||"—"],["Address",form.address||"—"],["Stage",form.stage],["Start Date",form.startDay||"—"],["Sacrament(s) Received",form.sacramentDate||"—"],["Sacraments Needed",(form.sacramentsNeeded||[]).join(", ")||"—"],["Marital Status",form.maritalStatus||"—"],["Sponsor",form.sponsor||"—"],["Confirmation Name",form.confirmationName||"—"]].map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`,fontSize:14}}>
                <span style={{color:C.muted}}>{k}</span><span style={{fontWeight:500}}>{v}</span>
              </div>
            ))}
            {form.notes&&<div style={{marginTop:12,padding:10,background:C.cream,borderRadius:8,fontSize:13,color:C.muted}}>{form.notes}</div>}
            <div style={{marginTop:16}}><button className="btn btn-primary" style={{width:"100%"}} onClick={()=>{openEdit(form);}}>Edit</button></div>
          </Modal>
        )}
      </>
    );
  }

  // ── ADMIN CALENDAR ──
  function AdminCalendar({events}) {
    const [modal,setModal]=useState(false);
    const [form,setForm]=useState({});
    const [error,setError]=useState("");
    const sorted=(events||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));

    const printSchedule=()=>{
      const rows=sorted.map((ev,i)=>`
        <tr style="background:${i%2===0?"#F7F4FC":"#FFFFFF"}">
          <td style="padding:10px 14px;border:1px solid #DDD5EE;font-size:13px;white-space:nowrap;">${new Date(ev.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"})}</td>
          <td style="padding:10px 14px;border:1px solid #DDD5EE;font-size:13px;">${ev.content||""}</td>
          <td style="padding:10px 14px;border:1px solid #DDD5EE;font-size:13px;">${ev.catechist||""}</td>
        </tr>`).join("");
      const win=window.open("","_blank");
      win.document.write(`
        <!DOCTYPE html><html><head>
          <title>OCIA Class Schedule — St. Catherine of Siena</title>
          <style>
            @page { size: letter portrait; margin: 0.75in; }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { font-family: 'Georgia', serif; color: #1a1a2e; }
            .header { text-align: center; margin-bottom: 28px; padding-bottom: 16px; border-bottom: 3px solid #3D2C6B; }
            .cross { font-size: 24px; color: #9B7FD4; margin-bottom: 6px; }
            .parish { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #9B7FD4; margin-bottom: 4px; }
            h1 { font-size: 22px; color: #3D2C6B; margin-bottom: 2px; }
            .subtitle { font-size: 12px; color: #7B6FA0; }
            table { width: 100%; border-collapse: collapse; margin-top: 8px; }
            th { background: #3D2C6B; color: #FFFFFF; padding: 10px 14px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid #3D2C6B; text-align: left; }
            .footer { margin-top: 24px; text-align: center; font-size: 11px; color: #7B6FA0; border-top: 1px solid #DDD5EE; padding-top: 12px; }
            @media print { button { display: none; } }
          </style>
        </head><body>
          <div class="header">
            <div class="cross">✝</div>
            <div class="parish">St. Catherine of Siena Catholic Church</div>
            <h1>OCIA Class Schedule</h1>
            <div class="subtitle">Carrollton, Texas · ${new Date().getFullYear()}–${new Date().getFullYear()+1} Program Year</div>
          </div>
          <table>
            <thead><tr><th style="width:22%">Date</th><th style="width:56%">Content</th><th style="width:22%">Catechist</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="footer">St. Catherine of Siena Catholic Church · OCIA Program · Carrollton, TX · Printed ${new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</div>
          <script>window.onload=()=>{window.print();}<\/script>
        </body></html>`);
      win.document.close();
    };

    const openAdd=()=>{setForm({date:"",content:"",catechist:""});setError("");setModal("add");};
    const openEdit=(ev)=>{setForm({...ev});setError("");setModal("edit");};
    const save=async()=>{
      if(!form.date){setError("Please select a date.");return;}
      if(!form.content){setError("Please enter the content.");return;}
      await saveItem("events",{...form,id:form.id||Date.now()});
      setModal(false);setError("");
    };

    const SessionRow=({ev})=>(
      <div style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 16px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{background:C.navy,color:C.goldLight,borderRadius:8,padding:"6px 8px",textAlign:"center",minWidth:48,flexShrink:0}}>
          <div style={{fontSize:9,textTransform:"uppercase",opacity:0.8}}>{new Date(ev.date+"T12:00:00").toLocaleString("en",{month:"short"})}</div>
          <div style={{fontSize:18,fontFamily:"Playfair Display,serif",fontWeight:700,lineHeight:1}}>{new Date(ev.date+"T12:00:00").getDate()}</div>
          <div style={{fontSize:9,opacity:0.8}}>{new Date(ev.date+"T12:00:00").getFullYear()}</div>

        <div style={{flex:1,minWidth:0}}>

          <button className="btn btn-outline btn-sm" onClick={()=>openEdit(ev)}>Edit</button>

          <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.border}`,background:C.cream,borderRadius:"12px 12px 0 0",display:"flex",justifyContent:"flex-end"}}>

        {(modal==="add"||modal==="edit")&&(
          <Modal title={modal==="add"?"Add Session":"Edit Session"} onClose={()=>setModal(false)}>

            <div className="form-group"><label className="form-label">Date</label><input className="form-input" type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            <div className="form-group"><label className="form-label">Content</label><textarea className="form-input" rows={3} value={form.content||""} onChange={e=>setForm(f=>({...f,content:e.target.value}))} placeholder="Topic or description…" style={{resize:"vertical"}}/></div>
            <div className="form-group"><label className="form-label">Catechist</label><input className="form-input" value={form.catechist||""} onChange={e=>setForm(f=>({...f,catechist:e.target.value}))} placeholder="Catechist name"/></div>
            <ModalButtons onCancel={()=>setModal(false)} onSave={save} saveLabel="Save Session"/>
          </Modal>
        )}
      </>
    );
  }

  // ── ADULT CONFIRMATION ──
  function AdminConfirmation({confirmands}) {
    const [search,setSearch]=useState("");
    const [modal,setModal]=useState(null);
    const [form,setForm]=useState({});
    const [saveError,setSaveError]=useState("");
    const filtered=(confirmands||[]).filter(s=>{
      const full=`${s.firstName||""} ${s.lastName||""}`.toLowerCase();
      return full.includes(search.toLowerCase())||(s.email||"").toLowerCase().includes(search.toLowerCase());
    }).sort((a,b)=>(a.lastName||"").localeCompare(b.lastName||""));
    const openAdd=()=>{setForm({firstName:"",lastName:"",email:"",phone:"",address:"",startDay:"",sacramentDate:"",maritalStatus:"",sponsor:"",confirmationName:"",certificateTurnedIn:[],notes:""});setSaveError("");setModal("add");};
    const openEdit=(s)=>{setForm({...s});setSaveError("");setModal("edit");};
    const openView=(s)=>{setForm({...s});setModal("view");};
    const save=async()=>{
      if(!form.lastName&&!form.firstName){setSaveError("Please enter the student's name.");return;}
      setSaveError("");
      const item={...form,name:`${form.firstName||""} ${form.lastName||""}`.trim(),id:form.id||Date.now(),joined:form.joined||new Date().toISOString().slice(0,10)};
      await saveItem("confirmands",item);
      setModal(null);
    };
    const remove=async(id)=>{if(confirm("Remove this student?"))await removeItem("confirmands",id);};
    const sendEmail=()=>{
      const emails=filtered.filter(s=>s.email).map(s=>s.email).join(";");
      if(!emails){alert("No student emails found for this group.");return;}
      window.location.href=`mailto:${emails}`;
    };
    return (
      <>
        <div className="section-header">
          <h2>Adult Confirmation</h2>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-input" placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
            <button className="btn btn-outline" onClick={sendEmail}>✉️ Email</button>
            <button className="btn btn-primary" onClick={openAdd}>+ Add</button>
          </div>
        </div>
        <div className="card" style={{padding:0}}>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Last Name</th><th>First Name</th><th>Email</th><th>Phone</th><th>Sponsor</th><th>Confirmation Name</th><th></th></tr></thead>
              <tbody>
                {filtered.length===0&&<tr><td colSpan={7}><div className="empty"><div className="empty-icon">👤</div><p>No students found</p></div></td></tr>}
                {filtered.map(s=>(
                  <tr key={s.id}>
                    <td><span style={{fontWeight:500,fontSize:13}}>{s.lastName||"—"}</span></td>
                    <td><span style={{fontSize:13}}>{s.firstName||"—"}</span></td>
                    <td><a href={`mailto:${s.email}`} style={{color:"#5B3FBE",textDecoration:"none",fontSize:13}}>{s.email||"—"}</a></td>
                    <td style={{fontSize:13}}><a href={`tel:${s.phone}`} style={{color:C.navy,textDecoration:"none"}}>{s.phone||"—"}</a></td>
                    <td style={{fontSize:13}}>{s.sponsor||"—"}</td>
                    <td style={{fontSize:13}}>{s.confirmationName||"—"}</td>
                    <td><div style={{display:"flex",gap:4}}><button className="btn btn-outline btn-sm" onClick={()=>openView(s)}>View</button><button className="btn btn-outline btn-sm" onClick={()=>openEdit(s)}>Edit</button><button className="btn btn-danger btn-sm" onClick={()=>remove(s.id)}>✕</button></div></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        {/* Add/Edit Modal */}
        {(modal==="add"||modal==="edit")&&(
          <Modal title={modal==="add"?"Add New Student":"Edit Student"} onClose={()=>setModal(null)}>
            {saveError&&<div className="error-msg">{saveError}</div>}
            <div className="form-row">
              <div className="form-group"><label className="form-label">First Name</label><input className="form-input" value={form.firstName||""} onChange={e=>setForm(f=>({...f,firstName:e.target.value}))} placeholder="First name"/></div>
              <div className="form-group"><label className="form-label">Last Name</label><input className="form-input" value={form.lastName||""} onChange={e=>setForm(f=>({...f,lastName:e.target.value}))} placeholder="Last name"/></div>
            </div>
            <div className="form-group"><label className="form-label">Phone</label><input className="form-input" value={form.phone||""} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="972-555-0100"/></div>
            <div className="form-group"><label className="form-label">Email</label><input className="form-input" type="email" value={form.email||""} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="email@example.com"/></div>
            <div className="form-group"><label className="form-label">Home Address</label><input className="form-input" value={form.address||""} onChange={e=>setForm(f=>({...f,address:e.target.value}))} placeholder="Street, City, State, ZIP"/></div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Start Date</label><input className="form-input" type="date" value={form.startDay||""} onChange={e=>setForm(f=>({...f,startDay:e.target.value}))}/></div>
              <div className="form-group"><label className="form-label">Date of Sacrament Received</label><input className="form-input" type="date" value={form.sacramentDate||""} onChange={e=>setForm(f=>({...f,sacramentDate:e.target.value}))}/></div>
            </div>
            <div className="form-group">
              <label className="form-label">Current Marital Status</label>
              {["Single","Married","Widowed","Divorced/Separated"].map(opt=>(
                <div key={opt} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <input type="checkbox" id={`ms_c_${opt}`} checked={(form.maritalStatus||"")===opt} onChange={e=>setForm(f=>({...f,maritalStatus:e.target.checked?opt:""}))}/>
                  <label htmlFor={`ms_c_${opt}`} style={{fontSize:14,cursor:"pointer"}}>{opt}</label>
                </div>
              ))}
            </div>
            <div className="form-group">
              <label className="form-label">Certificate Turned In</label>
              {["Baptism","First Holy Communion"].map(opt=>(
                <div key={opt} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <input type="checkbox" id={`cert_${opt}`} checked={(form.certificateTurnedIn||[]).includes(opt)} onChange={e=>{const cur=form.certificateTurnedIn||[];setForm(f=>({...f,certificateTurnedIn:e.target.checked?[...cur,opt]:cur.filter(x=>x!==opt)}));}}/>
                  <label htmlFor={`cert_${opt}`} style={{fontSize:14,cursor:"pointer"}}>{opt}</label>
                </div>
              ))}
            </div>
            <div className="form-row">
              <div className="form-group"><label className="form-label">Sponsor</label><input className="form-input" value={form.sponsor||""} onChange={e=>setForm(f=>({...f,sponsor:e.target.value}))} placeholder="Sponsor name"/></div>
              <div className="form-group"><label className="form-label">Confirmation Name</label><input className="form-input" value={form.confirmationName||""} onChange={e=>setForm(f=>({...f,confirmationName:e.target.value}))} placeholder="Saint name"/></div>
            </div>
            <div className="form-group"><label className="form-label">Notes</label><textarea className="form-input" rows={2} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} style={{resize:"vertical"}}/></div>
            <ModalButtons onCancel={()=>setModal(null)} onSave={save}/>
          </Modal>
        )}

        {/* View Modal */}
        {modal==="view"&&(
          <Modal title="Student Profile" onClose={()=>setModal(null)}>
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
              <div style={{width:48,height:48,borderRadius:"50%",background:C.navy,color:C.goldLight,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:700}}>{((form.firstName||"")[0]||"")}{((form.lastName||"")[0]||"")}</div>
              <div><div style={{fontFamily:"Playfair Display,serif",fontSize:18}}>{form.firstName} {form.lastName}</div><span style={{fontSize:12,color:C.muted}}>Adult Confirmation</span></div>
            </div>
            {[["First Name",form.firstName||"—"],["Last Name",form.lastName||"—"],["Email",form.email||"—"],["Phone",form.phone||"—"],["Address",form.address||"—"],["Start Date",form.startDay||"—"],["Date of Sacrament Received",form.sacramentDate||"—"],["Marital Status",form.maritalStatus||"—"],["Certificate Turned In",(form.certificateTurnedIn||[]).join(", ")||"—"],["Sponsor",form.sponsor||"—"],["Confirmation Name",form.confirmationName||"—"]].map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`,fontSize:14}}>
                <span style={{color:C.muted}}>{k}</span><span style={{fontWeight:500,textAlign:"right",maxWidth:"60%"}}>{v}</span>
              </div>
            ))}
            {form.notes&&<div style={{marginTop:12,padding:10,background:C.cream,borderRadius:8,fontSize:13,color:C.muted}}>{form.notes}</div>}
            <div style={{marginTop:16}}><button className="btn btn-primary" style={{width:"100%"}} onClick={()=>openEdit(form)}>Edit</button></div>
          </Modal>
        )}
      </>
    );
  }
  function AdminSettings({stages,setStages,students}) {
    const [newStage,setNewStage]=useState("");
    const [editingIdx,setEditingIdx]=useState(null);
    const [editingVal,setEditingVal]=useState("");
    const addStage=()=>{const t=newStage.trim();if(!t||stages.includes(t))return;setStages([...stages,t]);setNewStage("");};
    const deleteStage=(idx)=>{
      const name=stages[idx];
      const inUse=(students||[]).some(s=>s.stage===name);
      if(inUse){alert(`Cannot delete "${name}" — students are in this stage.`);return;}
      if(!confirm(`Delete "${name}"?`))return;
      setStages(stages.filter((_,i)=>i!==idx));
    };
    const saveEdit=async(idx)=>{
      const t=editingVal.trim();if(!t){setEditingIdx(null);return;}
      const oldName=stages[idx];
      const newStages=stages.map((s,i)=>i===idx?t:s);
      setStages(newStages);
      for(const s of (students||[]).filter(s=>s.stage===oldName)){
        await saveItem("students",{...s,stage:t});
      }
      setEditingIdx(null);
    };
    const moveStage=(idx,dir)=>{const arr=[...stages];const swap=idx+dir;if(swap<0||swap>=arr.length)return;[arr[idx],arr[swap]]=[arr[swap],arr[idx]];setStages(arr);};
    return (
      <>
        <div className="section-header"><h2>Settings</h2></div>
        <div className="card" style={{maxWidth:520}}>
          <h3 style={{fontSize:16,marginBottom:4}}>Journey Stages</h3>
          <p style={{fontSize:13,color:C.muted,marginBottom:16}}>Add, rename, reorder, or remove stages.</p>
          {stages.map((s,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
              <span className={`badge-stage ${STAGE_CLASS[i%STAGE_CLASS.length]}`}>{i+1}</span>
              {editingIdx===i?(
                <input className="form-input" style={{flex:1,padding:"5px 8px",fontSize:13}} value={editingVal} onChange={e=>setEditingVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveEdit(i);if(e.key==="Escape")setEditingIdx(null);}} autoFocus/>
              ):(
                <span style={{flex:1,fontSize:14}}>{s}</span>
              )}
              <div style={{display:"flex",gap:3,flexShrink:0}}>
                {editingIdx===i?(
                  <><button className="btn btn-primary btn-sm" onClick={()=>saveEdit(i)}>✓</button><button className="btn btn-outline btn-sm" onClick={()=>setEditingIdx(null)}>✕</button></>
                ):(
                  <><button className="btn btn-outline btn-sm" onClick={()=>moveStage(i,-1)} style={{padding:"4px 7px",opacity:i===0?0.3:1}} disabled={i===0}>↑</button>
                  <button className="btn btn-outline btn-sm" onClick={()=>moveStage(i,1)} style={{padding:"4px 7px",opacity:i===stages.length-1?0.3:1}} disabled={i===stages.length-1}>↓</button>
                  <button className="btn btn-outline btn-sm" onClick={()=>{setEditingIdx(i);setEditingVal(s);}}>Edit</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>deleteStage(i)}>✕</button></>
                )}
              </div>
            </div>
          ))}
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <input className="form-input" value={newStage} onChange={e=>setNewStage(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addStage()} placeholder="New stage name…" style={{flex:1}}/>
            <button className="btn btn-primary" onClick={addStage}>+ Add</button>
          </div>
        </div>
      </>
    );
  }

  // ── STUDENT VIEWS ──
  function StudentAnnouncements({announcements}) {
    return (
      <>
        <div className="section-header"><h2>Announcements</h2></div>
        {(announcements||[]).map(a=>(
          <div key={a.id} className="announcement">
            <div className="ann-meta">{a.date}{a.urgent&&<span style={{color:C.danger,fontWeight:600}}> · Urgent</span>}</div>
            <div style={{fontWeight:500,fontSize:15,marginBottom:4}}>{a.title}</div>
            <div className="ann-body">{a.body}</div>
          </div>
        ))}
        {(announcements||[]).length===0&&<div className="empty"><div className="empty-icon">📢</div><p>No announcements yet</p></div>}
      </>
    );
  }

  function StudentMaterials({materials}) {
    const cats=[...new Set((materials||[]).map(m=>m.category))];
    return (
      <>
        <div className="section-header"><h2>Materials &amp; Resources</h2></div>
        {cats.map(cat=>(
          <div key={cat} style={{marginBottom:20}}>
            <h3 style={{fontSize:13,color:C.muted,marginBottom:10,textTransform:"uppercase",letterSpacing:1,fontFamily:"Source Sans 3,sans-serif",fontWeight:500}}>{cat}</h3>
            {(materials||[]).filter(m=>m.category===cat).map(m=>(
              <div key={m.id} className="material-item">
                <MatIcon type={m.type}/>
                <div className="material-info"><div className="material-name">{m.name}</div><div className="material-meta">{m.type==="pdf"?"PDF":m.type==="drive"?"Google Drive":"Link"}</div></div>
                <a href={m.url} target="_blank" rel="noreferrer"><button className="btn btn-gold btn-sm">Open ↗</button></a>
              </div>
            ))}
          </div>
        ))}
        {(materials||[]).length===0&&<div className="empty"><div className="empty-icon">📚</div><p>No materials yet</p></div>}
      </>
    );
  }

  function StudentCalendar({events}) {
    const todayStr=new Date().toISOString().slice(0,10);
    const sorted=(events||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    const upcoming=sorted.filter(e=>e.date>=todayStr);
    const past=sorted.filter(e=>e.date<todayStr).reverse();
    const SessionCard=({ev,isPast})=>(
      <div style={{display:"flex",alignItems:"flex-start",gap:12,padding:"14px 16px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{background:isPast?"#9B9B9B":C.navy,color:"#DDD0F5",borderRadius:8,padding:"6px 8px",textAlign:"center",minWidth:50,flexShrink:0}}>
          <div style={{fontSize:10,textTransform:"uppercase",opacity:0.9}}>{new Date(ev.date+"T12:00:00").toLocaleString("en",{month:"short"})}</div>
          <div style={{fontSize:20,fontFamily:"Playfair Display,serif",fontWeight:700,lineHeight:1}}>{new Date(ev.date+"T12:00:00").getDate()}</div>
          <div style={{fontSize:10,opacity:0.9}}>{new Date(ev.date+"T12:00:00").getFullYear()}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,color:C.navy,lineHeight:1.5,marginBottom:4,fontWeight:isPast?400:500}}>{ev.content}</div>
          <div style={{fontSize:13,color:C.muted}}>👤 {ev.catechist}</div>
        </div>
      </div>
    );
    return (
      <>
        <div className="section-header"><h2>Class Schedule</h2></div>
        <div className="card" style={{padding:0}}>
          {sorted.length===0&&<div className="empty"><div className="empty-icon">📅</div><p>No sessions scheduled yet</p></div>}
          {sorted.map(ev=><SessionCard key={ev.id} ev={ev} isPast={ev.date<todayStr}/>)}
        </div>
      </>
    );
  }

  // ── MAIN APP ──
  function App() {
    const students  = useCollection("students",  SEED_STUDENTS);
    const confirmands = useCollection("confirmands", []);
    const announcements = useCollection("announcements", SEED_ANN);
    const materials = useCollection("materials", SEED_MAT);
    const events    = useCollection("events",    SEED_EVT);
    const [stages, setStages] = useConfig("stages", DEFAULT_STAGES);
    const [currentUser, setCurrentUser] = useState(null);
    const [page, setPage] = useState("dashboard");
    const [sidebarOpen, setSidebarOpen] = useState(false);

    const loading = students===null || confirmands===null || announcements===null || materials===null || events===null;

    if (loading) return (
      <div className="loading-screen">
        <div className="cross">✝</div>
        <div style={{fontFamily:"Playfair Display,serif",fontSize:18}}>Loading OCIA Program…</div>
      </div>
    );

    if (!currentUser) return <LoginPage onLogin={u=>{setCurrentUser(u);setPage(u.role==="admin"?"dashboard":"announcements");}}/>;

    const isAdmin = currentUser.role==="admin";
    const isCatechist = currentUser.role==="catechist";
    const adminNav = [{id:"dashboard",label:"Dashboard",icon:"🏠"},{id:"students",label:"OCIA Students",icon:"👥"},{id:"confirmation",label:"Adult Confirmation",icon:"🕊️"},{id:"announcements",label:"Announcements",icon:"📢"},{id:"materials",label:"Materials",icon:"📚"},{id:"calendar",label:"Schedule",icon:"📅"},{id:"settings",label:"Settings",icon:"⚙️"}];
    const catechistNav = [{id:"announcements",label:"Announcements",icon:"📢"},{id:"materials",label:"Materials",icon:"📚"},{id:"calendar",label:"Schedule",icon:"📅"}];
    const studentNav = [{id:"announcements",label:"Announcements",icon:"📢"},{id:"materials",label:"Materials",icon:"📚"},{id:"calendar",label:"Schedule",icon:"📅"}];
    const nav = isAdmin ? adminNav : isCatechist ? catechistNav : studentNav;
    const titles = {dashboard:"Overview",students:"OCIA Students",confirmation:"Adult Confirmation",announcements:"Announcements",materials:"Materials",calendar:"Class Schedule",settings:"Settings"};
    const navigate = id => { setPage(id); setSidebarOpen(false); };

    return (
      <div className="app">
        {sidebarOpen&&<div className="sidebar-overlay" onClick={()=>setSidebarOpen(false)}/>}
        <div className={`sidebar${sidebarOpen?" open":""}`}>
          <div className="sidebar-logo">
            <div className="parish">St. Catherine of Siena</div>
            <h2>OCIA<br/>Program</h2>
            <span className="badge">Carrollton, TX</span>
          </div>
          <div className="sidebar-nav">
            {nav.map(item=>(
              <div key={item.id} className={`nav-item${page===item.id?" active":""}`} onClick={()=>navigate(item.id)}>
                <span className="nav-icon">{item.icon}</span>{item.label}
              </div>
            ))}
          </div>
          <div className="sidebar-footer">
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
              <div style={{width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,0.12)",color:"#DDD0F5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:600,flexShrink:0}}>{isAdmin?"M":isCatechist?"C":"✝"}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,color:"#FFF",fontWeight:500}}>{isAdmin?"Admin":isCatechist?"Catechist":"Student Portal"}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>{isAdmin?"Admin":isCatechist?"Catechist":"St. Catherine OCIA"}</div>
              </div>
            </div>
            <button className="logout-btn" style={{width:"100%",justifyContent:"center"}} onClick={()=>{setCurrentUser(null);setPage("dashboard");setSidebarOpen(false);}}>Sign Out</button>
          </div>
        </div>
        <div className="main">
          <div className="topbar">
            <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)}><span/><span/><span/></button>
            <div className="topbar-title">{titles[page]}</div>
            <div className="topbar-right"><div className="avatar">{isAdmin?"M":isCatechist?"C":"✝"}</div></div>
          </div>
          <div className="content">
            {isAdmin&&page==="dashboard"&&<AdminDashboard students={students} confirmands={confirmands} announcements={announcements} events={events} stages={stages}/>}
            {isAdmin&&page==="students"&&<AdminStudents students={students} stages={stages}/>}
            {isAdmin&&page==="confirmation"&&<AdminConfirmation confirmands={confirmands}/>}
            {isAdmin&&page==="announcements"&&<AdminAnnouncements announcements={announcements}/>}
            {isAdmin&&page==="materials"&&<AdminMaterials materials={materials}/>}
            {isAdmin&&page==="calendar"&&<AdminCalendar events={events}/>}
            {isAdmin&&page==="settings"&&<AdminSettings stages={stages} setStages={setStages} students={students}/>}
            {isCatechist&&page==="announcements"&&<StudentAnnouncements announcements={announcements}/>}
            {isCatechist&&page==="materials"&&<StudentMaterials materials={materials}/>}
            {isCatechist&&page==="calendar"&&<AdminCalendar events={events}/>}
            {!isAdmin&&!isCatechist&&page==="announcements"&&<StudentAnnouncements announcements={announcements}/>}
            {!isAdmin&&!isCatechist&&page==="materials"&&<StudentMaterials materials={materials}/>}
            {!isAdmin&&!isCatechist&&page==="calendar"&&<StudentCalendar events={events}/>}
          </div>
          <nav className="bottom-nav">
            <div className="bottom-nav-inner">
              {nav.map(item=>(
                <div key={item.id} className={`bottom-nav-item${page===item.id?" active":""}`} onClick={()=>navigate(item.id)}>
                  <span className="bn-icon">{item.icon}</span>
                  <span className="bn-label">{item.label}</span>
                </div>
              ))}
            </div>
          </nav>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
