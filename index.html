<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const C = {
    navy:"#3D2C6B", gold:"#9B7FD4", goldLight:"#DDD0F5", cream:"#F7F4FC",
    white:"#FFF", muted:"#7B6FA0", border:"#DDD5EE", danger:"#B84040", success:"#2E7D5A",
  };

  const DEFAULT_STAGES = ["Pre-Catechumenate","Catechumenate","Purification & Enlightenment","Mystagogy"];
  const STAGE_CLASS = ["stage-pre","stage-cat","stage-pe","stage-mys","stage-pre","stage-cat","stage-pe","stage-mys"];

  // ── FIREBASE HELPERS ──
  function useCollection(colName, seedData) {
    const [data, setData] = useState(null);
    useEffect(() => {
      const db = window.__db;
      const { collection, onSnapshot, setDoc, doc, getDoc } = window.__firebase;
      if (!db) return;
      const col = collection(db, colName);
      const unsub = onSnapshot(col, async snap => {
        if (snap.empty && seedData && seedData.length > 0) {
          // Check Firebase if this collection was ever initialized
          const initDoc = await getDoc(doc(db, "config", `init_${colName}`));
          if (!initDoc.exists()) {
            // First time ever — seed and mark as initialized
            await setDoc(doc(db, "config", `init_${colName}`), { initialized: true });
            for (const item of seedData) {
              await setDoc(doc(db, colName, String(item.id)), item);
            }
          } else {
            // Was initialized before — just show empty list
            setData([]);
          }
        } else {
          setData(snap.docs.map(d => d.data()));
        }
      });
      return unsub;
    }, [colName]);
    return data;
  }

  async function saveItem(colName, item) {
    const { doc, setDoc } = window.__firebase;
    const db = window.__db;
    await setDoc(doc(db, colName, String(item.id)), item);
  }

  async function removeItem(colName, id) {
    const { doc, deleteDoc } = window.__firebase;
    const db = window.__db;
    await deleteDoc(doc(db, colName, String(id)));
  }

  async function saveConfig(key, value) {
    const { doc, setDoc } = window.__firebase;
    const db = window.__db;
    await setDoc(doc(db, "config", key), { value });
  }

  function useConfig(key, defaultValue) {
    const [value, setValue] = useState(defaultValue);
    useEffect(() => {
      const db = window.__db;
      const { doc, onSnapshot } = window.__firebase;
      if (!db) return;
      const unsub = onSnapshot(doc(db, "config", key), snap => {
        if (snap.exists()) setValue(snap.data().value);
        else setValue(defaultValue);
      });
      return unsub;
    }, [key]);
    return [value, (v) => { setValue(v); saveConfig(key, v); }];
  }

  // ── SEED DATA ──
  const SEED_STUDENTS = [
    {id:1,name:"Maria Santos",email:"maria.santos@email.com",phone:"972-555-0101",stage:"Catechumenate",attendance:85,notes:"Sponsored by John D.",joined:"2025-09-10"},
    {id:2,name:"James Okafor",email:"james.okafor@email.com",phone:"972-555-0102",stage:"Pre-Catechumenate",attendance:70,notes:"",joined:"2026-01-15"},
    {id:3,name:"Linda Chen",email:"linda.chen@email.com",phone:"972-555-0103",stage:"Catechumenate",attendance:92,notes:"",joined:"2025-09-10"},
  ];
  const SEED_ANN = [
    {id:1,title:"Session this Wednesday",body:"This Wednesday we will cover the Sacrament of Baptism. Please read Chapter 12 beforehand.",date:"2026-06-01",urgent:false},
    {id:2,title:"Retreat Day — June 21",body:"Our annual retreat will be held on Saturday, June 21st. All catechumens are strongly encouraged to attend.",date:"2026-05-20",urgent:false},
  ];
  const SEED_MAT = [
    {id:1,name:"Catechism of the Catholic Church",type:"link",url:"https://www.usccb.org/sites/default/files/flipbooks/catechism/",category:"Reference"},
    {id:2,name:"Prayer Booklet for Catechumens",type:"pdf",url:"https://drive.google.com/",category:"Prayer"},
  ];
  const SEED_EVT = [
    {id:1,date:"2026-06-04",content:"Introduction to the OCIA Process",catechist:""},
    {id:2,date:"2026-06-11",content:"The Sacrament of Baptism",catechist:""},
    {id:3,date:"2026-06-18",content:"The Creed — What Catholics Believe",catechist:""},
  ];

  function initials(name) { return (name||"").split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase(); }
  function StageTag({stage,stages=DEFAULT_STAGES}) { return <span className={`badge-stage ${STAGE_CLASS[stages.indexOf(stage)%STAGE_CLASS.length]||"stage-pre"}`}>{stage}</span>; }
  function MatIcon({type}) {
    const m={pdf:{bg:"#FEE2E2",ic:"📄"},drive:{bg:"#DBEAFE",ic:"🔗"},link:{bg:"#D1FAE5",ic:"🌐"}};
    const t=m[type]||m.link;
    return <div className="material-icon" style={{background:t.bg}}>{t.ic}</div>;
  }

  function Modal({title,onClose,children}) {
    return (
      <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="modal">
          <div className="modal-header"><h3>{title}</h3><button className="close-btn" onClick={onClose}>×</button></div>
          <div className="modal-body">{children}</div>
        </div>
      </div>
    );
  }

  function ModalButtons({onCancel,onSave,saveLabel="Save"}) {
    return (
      <div style={{display:"flex",gap:8,marginTop:16,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
        <button className="btn btn-outline" style={{flex:1}} onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary" style={{flex:2}} onClick={onSave}>✓ {saveLabel}</button>
      </div>
    );
  }

  // ── LOGIN ──
  function LoginPage({onLogin}) {
    const [role,setRole]=useState(null);
    const [password,setPassword]=useState("");
    const [showPw,setShowPw]=useState(false);
    const [error,setError]=useState("");

    const login=()=>{
      setError("");
      if(role==="admin"&&password.trim().toLowerCase()==="ruby"){onLogin({name:"Admin",role:"admin"});return;}
      if(role==="catechist"&&password.trim().toLowerCase()==="jesus"){onLogin({name:"Catechist",role:"catechist"});return;}
      setError("Incorrect password.");
    };

    const roles=[
      {r:"admin",    label:"Admin",     color:"#3D2C6B", light:"#EDE9FE", border:"#9B7FD4"},
      {r:"catechist",label:"Catechist", color:"#065F46", light:"#D1FAE5", border:"#34D399"},
      {r:"student",  label:"Student",   color:"#1E40AF", light:"#DBEAFE", border:"#60A5FA"},
    ];

    return (
      <div style={{minHeight:"100dvh",background:"linear-gradient(135deg,#3D2C6B 0%,#6D4C9E 50%,#9B7FD4 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#FFFFFF",borderRadius:24,padding:"40px 36px",width:"100%",maxWidth:420,boxShadow:"0 32px 80px rgba(0,0,0,0.35)"}}>

          {/* Logo */}
          <div style={{textAlign:"center",marginBottom:32}}>
            <div style={{width:64,height:64,borderRadius:"50%",background:"linear-gradient(135deg,#3D2C6B,#9B7FD4)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",boxShadow:"0 8px 24px rgba(61,44,107,0.35)"}}>
              <span style={{fontSize:28,color:"#FFF"}}>✝</span>
            </div>
            <div style={{fontSize:11,letterSpacing:2,textTransform:"uppercase",color:"#9B7FD4",marginBottom:4}}>St. Catherine of Siena</div>
            <h2 style={{fontFamily:"Playfair Display,serif",fontSize:26,color:"#3D2C6B",marginBottom:2}}>OCIA Program</h2>
            <p style={{fontSize:13,color:"#7B6FA0"}}>Carrollton, Texas</p>
          </div>

          <p style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:2,color:"#7B6FA0",textAlign:"center",marginBottom:16}}>Login as</p>

          {/* Role buttons */}
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:20}}>
            {roles.map(({r,label,color,light,border})=>(
              <button key={r} onClick={()=>{setRole(r);setPassword("");setError("");}}
                style={{width:"100%",padding:"15px 20px",borderRadius:12,border:`2px solid ${role===r?border:"#E5E7EB"}`,background:role===r?light:"#F9FAFB",cursor:"pointer",fontSize:16,fontWeight:600,color:role===r?color:"#374151",fontFamily:"Source Sans 3,sans-serif",transition:"all 0.15s",textAlign:"center"}}>
                {label}
              </button>
            ))}
          </div>

          {/* Password field — only for admin and catechist */}

    const openAdd=()=>{setForm({firstName:"",lastName:"",email:"",phone:"",stage:(stages||DEFAULT_STAGES)[0],notes:"",address:"",startDay:"",sacramentDate:"",sacramentsNeeded:[],maritalStatus:"",sponsor:"",confirmationName:""});setSaveError("");setModal("add");};

              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`,fontSize:14}}>

    };

    const openAdd=()=>{setForm({date:"",content:"",catechist:""});setError("");setModal("add");};
    const openEdit=(ev)=>{setForm({...ev});setError("");setModal("edit");};
    const save=async()=>{
      if(!form.date){setError("Please select a date.");return;}
      if(!form.content){setError("Please enter the content.");return;}
      await saveItem("events",{...form,id:form.id||Date.now()});
      setModal(false);setError("");
    };
    const remove=async(id)=>{if(confirm("Remove this session?"))await removeItem("events",id);};

    const SessionRow=({ev})=>(
      <div style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 16px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{background:C.navy,color:C.goldLight,borderRadius:8,padding:"6px 8px",textAlign:"center",minWidth:48,flexShrink:0}}>
          <div style={{fontSize:9,textTransform:"uppercase",opacity:0.8}}>{new Date(ev.date+"T12:00:00").toLocaleString("en",{month:"short"})}</div>
          <div style={{fontSize:18,fontFamily:"Playfair Display,serif",fontWeight:700,lineHeight:1}}>{new Date(ev.date+"T12:00:00").getDate()}</div>
          <div style={{fontSize:9,opacity:0.8}}>{new Date(ev.date+"T12:00:00").getFullYear()}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,color:C.navy,marginBottom:3,lineHeight:1.4}}>{ev.content}</div>
          <div style={{fontSize:12,color:C.muted}}>👤 {ev.catechist}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
          <button className="btn btn-outline btn-sm" onClick={()=>openEdit(ev)}>Edit</button>
          <button className="btn btn-danger btn-sm" onClick={()=>remove(ev.id)}>✕</button>
        </div>
      </div>
    );

    return (
      <>
        <div className="section-header">
          <h2>Class Schedule</h2>
          <button className="btn btn-primary" onClick={openAdd}>+ Add Session</button>
        </div>
        <div className="card" style={{padding:0}}>
          <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.border}`,background:C.cream,borderRadius:"12px 12px 0 0",display:"flex",justifyContent:"flex-end"}}>
            <button className="btn btn-outline btn-sm" onClick={printSchedule}>🖨️ Print Schedule</button>
          </div>
          {sorted.length===0&&<div className="empty"><div className="empty-icon">📅</div><p>No sessions yet</p></div>}
          {sorted.map(ev=><SessionRow key={ev.id} ev={ev}/>)}
        </div>
        {(modal==="add"||modal==="edit")&&(
          <Modal title={modal==="add"?"Add Session":"Edit Session"} onClose={()=>setModal(false)}>
            {error&&<div className="error-msg">{error}</div>}
            <div className="form-group"><label className="form-label">Date</label><input className="form-input" type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            <div className="form-group"><label className="form-label">Content</label><textarea className="form-input" rows={3} value={form.content||""} onChange={e=>setForm(f=>({...f,content:e.target.value}))} placeholder="Topic or description…" style={{resize:"vertical"}}/></div>
            <div className="form-group"><label className="form-label">Catechist</label><input className="form-input" value={form.catechist||""} onChange={e=>setForm(f=>({...f,catechist:e.target.value}))} placeholder="Catechist name"/></div>
            <ModalButtons onCancel={()=>setModal(false)} onSave={save} saveLabel="Save Session"/>
          </Modal>
        )}
      </>
    );
  }

  // ── ADMIN SETTINGS ──
  function AdminSettings({stages,setStages,students}) {
    const [newStage,setNewStage]=useState("");
    const [editingIdx,setEditingIdx]=useState(null);
    const [editingVal,setEditingVal]=useState("");
    const addStage=()=>{const t=newStage.trim();if(!t||stages.includes(t))return;setStages([...stages,t]);setNewStage("");};
    const deleteStage=(idx)=>{
      const name=stages[idx];
      const inUse=(students||[]).some(s=>s.stage===name);
      if(inUse){alert(`Cannot delete "${name}" — students are in this stage.`);return;}
      if(!confirm(`Delete "${name}"?`))return;
      setStages(stages.filter((_,i)=>i!==idx));
    };
    const saveEdit=async(idx)=>{
      const t=editingVal.trim();if(!t){setEditingIdx(null);return;}
      const oldName=stages[idx];
      const newStages=stages.map((s,i)=>i===idx?t:s);
      setStages(newStages);
      for(const s of (students||[]).filter(s=>s.stage===oldName)){
        await saveItem("students",{...s,stage:t});
      }
      setEditingIdx(null);
    };
    const moveStage=(idx,dir)=>{const arr=[...stages];const swap=idx+dir;if(swap<0||swap>=arr.length)return;[arr[idx],arr[swap]]=[arr[swap],arr[idx]];setStages(arr);};
    return (
      <>
        <div className="section-header"><h2>Settings</h2></div>
        <div className="card" style={{maxWidth:520}}>
          <h3 style={{fontSize:16,marginBottom:4}}>Journey Stages</h3>
          <p style={{fontSize:13,color:C.muted,marginBottom:16}}>Add, rename, reorder, or remove stages.</p>
          {stages.map((s,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
              <span className={`badge-stage ${STAGE_CLASS[i%STAGE_CLASS.length]}`}>{i+1}</span>
              {editingIdx===i?(
                <input className="form-input" style={{flex:1,padding:"5px 8px",fontSize:13}} value={editingVal} onChange={e=>setEditingVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveEdit(i);if(e.key==="Escape")setEditingIdx(null);}} autoFocus/>
              ):(
                <span style={{flex:1,fontSize:14}}>{s}</span>
              )}
              <div style={{display:"flex",gap:3,flexShrink:0}}>
                {editingIdx===i?(
                  <><button className="btn btn-primary btn-sm" onClick={()=>saveEdit(i)}>✓</button><button className="btn btn-outline btn-sm" onClick={()=>setEditingIdx(null)}>✕</button></>
                ):(
                  <><button className="btn btn-outline btn-sm" onClick={()=>moveStage(i,-1)} style={{padding:"4px 7px",opacity:i===0?0.3:1}} disabled={i===0}>↑</button>
                  <button className="btn btn-outline btn-sm" onClick={()=>moveStage(i,1)} style={{padding:"4px 7px",opacity:i===stages.length-1?0.3:1}} disabled={i===stages.length-1}>↓</button>
                  <button className="btn btn-outline btn-sm" onClick={()=>{setEditingIdx(i);setEditingVal(s);}}>Edit</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>deleteStage(i)}>✕</button></>
                )}
              </div>
            </div>
          ))}
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <input className="form-input" value={newStage} onChange={e=>setNewStage(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addStage()} placeholder="New stage name…" style={{flex:1}}/>
            <button className="btn btn-primary" onClick={addStage}>+ Add</button>
          </div>
        </div>
      </>
    );
  }

  // ── STUDENT VIEWS ──
  function StudentAnnouncements({announcements}) {
    return (
      <>
        <div className="section-header"><h2>Announcements</h2></div>
        {(announcements||[]).map(a=>(
          <div key={a.id} className="announcement">
            <div className="ann-meta">{a.date}{a.urgent&&<span style={{color:C.danger,fontWeight:600}}> · Urgent</span>}</div>
            <div style={{fontWeight:500,fontSize:15,marginBottom:4}}>{a.title}</div>
            <div className="ann-body">{a.body}</div>
          </div>
        ))}
        {(announcements||[]).length===0&&<div className="empty"><div className="empty-icon">📢</div><p>No announcements yet</p></div>}
      </>
    );
  }

  function StudentMaterials({materials}) {
    const cats=[...new Set((materials||[]).map(m=>m.category))];
    return (
      <>
        <div className="section-header"><h2>Materials &amp; Resources</h2></div>
        {cats.map(cat=>(
          <div key={cat} style={{marginBottom:20}}>
            <h3 style={{fontSize:13,color:C.muted,marginBottom:10,textTransform:"uppercase",letterSpacing:1,fontFamily:"Source Sans 3,sans-serif",fontWeight:500}}>{cat}</h3>
            {(materials||[]).filter(m=>m.category===cat).map(m=>(
              <div key={m.id} className="material-item">
                <MatIcon type={m.type}/>
                <div className="material-info"><div className="material-name">{m.name}</div><div className="material-meta">{m.type==="pdf"?"PDF":m.type==="drive"?"Google Drive":"Link"}</div></div>
                <a href={m.url} target="_blank" rel="noreferrer"><button className="btn btn-gold btn-sm">Open ↗</button></a>
              </div>
            ))}
          </div>
        ))}
        {(materials||[]).length===0&&<div className="empty"><div className="empty-icon">📚</div><p>No materials yet</p></div>}
      </>
    );
  }

  function StudentCalendar({events}) {
    const todayStr=new Date().toISOString().slice(0,10);
    const sorted=(events||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    const upcoming=sorted.filter(e=>e.date>=todayStr);
    const past=sorted.filter(e=>e.date<todayStr).reverse();
    const SessionCard=({ev,isPast})=>(
      <div style={{display:"flex",alignItems:"flex-start",gap:12,padding:"14px 16px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{background:isPast?"#9B9B9B":C.navy,color:"#DDD0F5",borderRadius:8,padding:"6px 8px",textAlign:"center",minWidth:50,flexShrink:0}}>
          <div style={{fontSize:10,textTransform:"uppercase",opacity:0.9}}>{new Date(ev.date+"T12:00:00").toLocaleString("en",{month:"short"})}</div>
          <div style={{fontSize:20,fontFamily:"Playfair Display,serif",fontWeight:700,lineHeight:1}}>{new Date(ev.date+"T12:00:00").getDate()}</div>
          <div style={{fontSize:10,opacity:0.9}}>{new Date(ev.date+"T12:00:00").getFullYear()}</div>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,color:C.navy,lineHeight:1.5,marginBottom:4,fontWeight:isPast?400:500}}>{ev.content}</div>
          <div style={{fontSize:13,color:C.muted}}>👤 {ev.catechist}</div>
        </div>
      </div>
    );
    return (
      <>
        <div className="section-header"><h2>Class Schedule</h2></div>
        <div className="card" style={{padding:0}}>
          {sorted.length===0&&<div className="empty"><div className="empty-icon">📅</div><p>No sessions scheduled yet</p></div>}
          {sorted.map(ev=><SessionCard key={ev.id} ev={ev} isPast={ev.date<todayStr}/>)}
        </div>
      </>
    );
  }

  // ── MAIN APP ──
  function App() {
    const students  = useCollection("students",  SEED_STUDENTS);
    const announcements = useCollection("announcements", SEED_ANN);
    const materials = useCollection("materials", SEED_MAT);
    const events    = useCollection("events",    SEED_EVT);
    const [stages, setStages] = useConfig("stages", DEFAULT_STAGES);
    const [currentUser, setCurrentUser] = useState(null);
    const [page, setPage] = useState("dashboard");
    const [sidebarOpen, setSidebarOpen] = useState(false);

    const loading = students===null || announcements===null || materials===null || events===null;

    if (loading) return (
      <div className="loading-screen">
        <div className="cross">✝</div>
        <div style={{fontFamily:"Playfair Display,serif",fontSize:18}}>Loading OCIA Program…</div>
      </div>
    );

    if (!currentUser) return <LoginPage onLogin={u=>{setCurrentUser(u);setPage(u.role==="admin"?"dashboard":"announcements");}}/>;

    const isAdmin = currentUser.role==="admin";
    const isCatechist = currentUser.role==="catechist";
    const adminNav = [{id:"dashboard",label:"Dashboard",icon:"🏠"},{id:"students",label:"Students",icon:"👥"},{id:"announcements",label:"Announcements",icon:"📢"},{id:"materials",label:"Materials",icon:"📚"},{id:"calendar",label:"Schedule",icon:"📅"},{id:"settings",label:"Settings",icon:"⚙️"}];
    const catechistNav = [{id:"announcements",label:"Announcements",icon:"📢"},{id:"materials",label:"Materials",icon:"📚"},{id:"calendar",label:"Schedule",icon:"📅"}];
    const studentNav = [{id:"announcements",label:"Announcements",icon:"📢"},{id:"materials",label:"Materials",icon:"📚"},{id:"calendar",label:"Schedule",icon:"📅"}];
    const nav = isAdmin ? adminNav : isCatechist ? catechistNav : studentNav;
    const titles = {dashboard:"Overview",students:"Students",announcements:"Announcements",materials:"Materials",calendar:"Class Schedule",settings:"Settings"};
    const navigate = id => { setPage(id); setSidebarOpen(false); };

    return (
      <div className="app">
        {sidebarOpen&&<div className="sidebar-overlay" onClick={()=>setSidebarOpen(false)}/>}
        <div className={`sidebar${sidebarOpen?" open":""}`}>
          <div className="sidebar-logo">
            <div className="parish">St. Catherine of Siena</div>
            <h2>OCIA<br/>Program</h2>
            <span className="badge">Carrollton, TX</span>
          </div>
          <div className="sidebar-nav">
            {nav.map(item=>(
              <div key={item.id} className={`nav-item${page===item.id?" active":""}`} onClick={()=>navigate(item.id)}>
                <span className="nav-icon">{item.icon}</span>{item.label}
              </div>
            ))}
          </div>
          <div className="sidebar-footer">
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
              <div style={{width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,0.12)",color:"#DDD0F5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:600,flexShrink:0}}>{isAdmin?"M":isCatechist?"C":"✝"}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,color:"#FFF",fontWeight:500}}>{isAdmin?"Admin":isCatechist?"Catechist":"Student Portal"}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>{isAdmin?"Admin":isCatechist?"Catechist":"St. Catherine OCIA"}</div>
              </div>
            </div>
            <button className="logout-btn" style={{width:"100%",justifyContent:"center"}} onClick={()=>{setCurrentUser(null);setPage("dashboard");setSidebarOpen(false);}}>Sign Out</button>
          </div>
        </div>
        <div className="main">
          <div className="topbar">
            <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)}><span/><span/><span/></button>
            <div className="topbar-title">{titles[page]}</div>
            <div className="topbar-right"><div className="avatar">{isAdmin?"M":isCatechist?"C":"✝"}</div></div>
          </div>
          <div className="content">
            {isAdmin&&page==="dashboard"&&<AdminDashboard students={students} announcements={announcements} events={events} stages={stages}/>}
            {isAdmin&&page==="students"&&<AdminStudents students={students} stages={stages}/>}
            {isAdmin&&page==="announcements"&&<AdminAnnouncements announcements={announcements}/>}
            {isAdmin&&page==="materials"&&<AdminMaterials materials={materials}/>}
            {isAdmin&&page==="calendar"&&<AdminCalendar events={events}/>}
            {isAdmin&&page==="settings"&&<AdminSettings stages={stages} setStages={setStages} students={students}/>}
            {isCatechist&&page==="announcements"&&<StudentAnnouncements announcements={announcements}/>}
            {isCatechist&&page==="materials"&&<StudentMaterials materials={materials}/>}
            {isCatechist&&page==="calendar"&&<AdminCalendar events={events}/>}
            {!isAdmin&&!isCatechist&&page==="announcements"&&<StudentAnnouncements announcements={announcements}/>}
            {!isAdmin&&!isCatechist&&page==="materials"&&<StudentMaterials materials={materials}/>}
            {!isAdmin&&!isCatechist&&page==="calendar"&&<StudentCalendar events={events}/>}
          </div>
          <nav className="bottom-nav">
            <div className="bottom-nav-inner">
              {nav.map(item=>(
                <div key={item.id} className={`bottom-nav-item${page===item.id?" active":""}`} onClick={()=>navigate(item.id)}>
                  <span className="bn-icon">{item.icon}</span>
                  <span className="bn-label">{item.label}</span>
                </div>
              ))}
            </div>
          </nav>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
